<!doctype html>
<html lang="th">
<head>

  <style>
    :root { --bg:#f3f2eb; --paper:#fffefa; --ink:#1c2c26; --muted:#486059; --green:#164e3c; --pale:#e1f0e7; --line:#d5dfd6; --wrong:#8d302d; }
    * { box-sizing:border-box; }

    body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.62 "Noto Sans Thai", Thonburi, "Leelawadee UI", Tahoma, system-ui, sans-serif; }

    .study { padding:clamp(1rem,4vw,1.8rem); background:var(--paper); border:1px solid var(--line); border-radius:1.05rem; box-shadow:0 .45rem 1.75rem #19382e0b; }

</head>
<body>
<main>
  <header>
    <h1>เตรียมสอบนักการทูต ภาค ก</h1>
    <p>ปี 2569 · แฟลชการ์ด 304 ข้อ · 12 ชุดฝึก · ข้อสอบจำลอง 3 ชุด</p>
  </header>
  <div class="toolbar">
    <div class="deck-field">
      <label for="deck">เลือกชุด</label>
      <select id="deck"></select>
    </div>

    <button id="restart" type="button" hidden>เริ่มใหม่</button>
  </div>
  <div id="result" hidden tabindex="-1">
    <p><strong id="score"></strong></p>
    <p id="breakdown"></p>
    <p>เลื่อนดูข้อที่ทำแล้วเพื่อทบทวนคำตอบและคำอธิบาย</p>
  </div>
  <section class="study" aria-label="คำถาม">
    <div class="meta"><span id="topic"></span><span id="position"></span></div>
    <progress id="progress" aria-label="ตำแหน่งข้อ"></progress>
    <h2 id="prompt" tabindex="-1"></h2>
    <fieldset id="choices">
      <legend class="visually-hidden">ตัวเลือกคำตอบ</legend>
      <div id="option-list"></div>
    </fieldset>
    <div id="feedback" hidden aria-live="polite">
      <p id="correct"></p>
      <p id="explanation"></p>
      <ul id="sources"></ul>
    </div>
    <div class="row actions">
      <button id="previous" type="button">← ก่อนหน้า</button>
      <button id="reveal" class="primary" type="button" aria-controls="feedback" aria-expanded="false">ดูคำตอบ</button>
      <button id="submit" class="primary" type="button" hidden>ส่งคำตอบ</button>
      <button id="next" type="button">ถัดไป →</button>
    </div>
    <p id="status" aria-live="polite"></p>
  </section>
  <footer>
    <p>คำถามฝึกแต่งขึ้นตามขอบเขตที่ประกาศ แต่ละข้อสอบจำลองคัด 40 ข้อจากคลังฝึกและแสดงเฉลยหลังส่ง</p>
    <p><a href="https://www.mfa.go.th/th/content/สอบนักการทูต2569" target="_blank" rel="noopener noreferrer">ประกาศจากกระทรวงการต่างประเทศ</a></p>
  </footer>
  <noscript>เปิดไฟล์นี้ในเบราว์เซอร์ที่เปิดใช้งาน JavaScript</noscript>
</main>

นดภาษาทำงานไว้","refs":["charter"],"subject":"th","level":1},{"question":"ข้อใดกล่าวถึงสถานะของอาเซียนตามกฎบัตรได้ถูกต้อง?","answer":"อาเซียนมีสภาพบุคคลตามกฎหมายในฐานะองค์การระหว่างรัฐบาล","options":["อาเซียนมีสภาพบุคคลตามกฎหมายในฐานะองค์การระหว่างรัฐบาล","อาเซียนมีฐานะเป็นหน่วยงานย่อยของสหประชาชาติ","อาเซียนคือสหพันธรัฐของเอเชียตะวันออกเฉียงใต้"],"explanation":"ข้อ 3 ระบุสภาพบุคคลของอาเซียนในฐานะองค์การระหว่างรัฐบาล","refs":["charter"],"subject":"th","level":1},{"question":"ประเทศใดเข้าอาเซียนภายหลังเวียดนาม?","answer":"กัมพูชา","options":["กัมพูชา","บรูไน","ฟิลิปปินส์"],"explanation":"เวียดนามเข้าในปี 2538 และกัมพูชาเข้าในปี 2542","refs":["members"],"subject":"th","level":1},{"question":"ASEAN Summit ประกอบด้วยผู้แทนระดับใด?","answer":"ประมุขแห่งรัฐหรือหัวหน้ารัฐบาลของประเทศสมาชิก","options":["ประมุขแห่งรัฐหรือหัวหน้ารัฐบาลของประเทศสมาชิก","ผู้แทนถาวรประจำอาเซียนเท่านั้น","เลขาธิการอาเซียนกับเอกอัครราชทูตคู่เจรจา"],"explanation":"ข้อ 7 กำหนดองค์ประกอบและให้เป็นองค์กรกำหนดนโยบายสูงสุดของอาเซียน","refs":["charter"],"subject":"th","level":1},{"question":"The ministers arrived ___ the conference center before noon.","answer":"at","options":["at","on","for"],"explanation":"Use “arrive at” for a specific place.","refs":[],"subject":"en","level":1},{"question":"The office ___ applications every weekday.","answer":"accepts","options":["accepts","accept","accepting"],"explanation":"“The office” is a singular subject in the simple present.","refs":[],"subject":"en","level":1},{"question":"The meeting ___ at 9 a.m. yesterday.","answer":"began","options":["began","has begun","begins"],"explanation":"A finished past time calls for the simple past.","refs":[],"subject":"en","level":1},{"question":"There ___ two copies of the report on the desk.","answer":"are","options":["are","is","has"],"explanation":"The noun phrase after “there” is plural.","refs":[],"subject":"en","level":1},{"question":"Which word best completes the sentence? “Please ___ the form before submitting it.”","answer":"complete","options":["complete","completion","completely"],"explanation":"“Please” introduces an imperative with a base verb.","refs":[],"subject":"en","level":1},{"question":"What does “annual” mean in “an annual summit”?","answer":"Held once a year","options":["Held once a year","Held once a month","Held only one time"],"explanation":"“Annual” describes something that occurs every year.","refs":[],"subject":"en","level":1},{"question":"The chair thanked the delegates ___ their cooperation.","answer":"for","options":["for","from","with"],"explanation":"The pattern is “thank someone for something.”","refs":[],"subject":"en","level":1},{"question":"Which sentence uses “both” and the verb correctly?","answer":"Both delegates signed the document.","options":["Both delegates signed the document.","Both delegate signed the document.","Both delegates has signed the document."],"explanation":"“Both” takes a plural count noun here.","refs":[],"subject":"en","level":1},{"question":"“The room can seat 40 people.” What does “seat” mean?","answer":"Provide seats for","options":["Provide seats for","Give directions to","Invite officially"],"explanation":"As a verb here, “seat” expresses capacity.","refs":[],"subject":"en","level":1},{"question":"“The public session begins at 10. Registration opens half an hour earlier.” When does registration open?","answer":"9:30","options":["9:30","10:30","9:00"],"explanation":"Subtract 30 minutes from 10:00.","refs":[],"subject":"en","level":1},{"question":"หน่วยงานใดเป็นองค์กรตุลาการหลักของสหประชาชาติ?","answer":"ศาลยุติธรรมระหว่างประเทศ (ICJ)","options":["ศาลยุติธรรมระหว่างประเทศ (ICJ)","ศาลอาญาระหว่างประเทศ (ICC)","ศาลอนุญาโตตุลาการถาวร (PCA)"],"explanation":"กฎบัตรสหประชาชาติ ข้อ 92 กำหนดสถานะของ ICJ","refs":["un"],"subject":"th","level":1},{"question":"ประเทศหนึ่งมีสมาชิกภาพใน UNGA โดยทั่วไปมีสิทธิออกเสียงกี่เสียง?","answer":"หนึ่งเสียง","options":["หนึ่งเสียง","ตามจำนวนประชากร","หนึ่งเสียงต่อคณะผู้แทนย่อย"],"explanation":"กฎบัตรข้อ 18 ให้สมาชิกสมัชชาใหญ่แต่ละประเทศมีหนึ่งเสียง","refs":["un"],"subject":"th","level":1},{"question":"ประเทศใดมีที่นั่งถาวรในคณะมนตรีความมั่นคง UN?","answer":"ฝรั่งเศส","options":["ฝรั่งเศส","เยอรมนี","ญี่ปุ่น"],"explanation":"ฝรั่งเศสเป็นหนึ่งใน P5 ร่วมกับจีน รัสเซีย สหราชอาณาจักร และสหรัฐฯ","refs":["un"],"subject":"th","level":1},{"question":"คณะมนตรีความมั่นคง UN มีสมาชิกทั้งหมดกี่ประเทศ?","answer":"15 ประเทศ","options":["15 ประเทศ","10 ประเทศ","5 ประเทศ"],"explanation":"มีสมาชิกถาวร 5 และสมาชิกไม่ถาวร 10","refs":["un"],"subject":"th","level":1},{"question":"องค์กรใดเป็นกลไกหลักด้านการหารือและประสานงานเศรษฐกิจและสังคมในระบบ UN?","answer":"ECOSOC","options":["ECOSOC","ICJ","คณะมนตรีภาวะทรัสตี"],"explanation":"ECOSOC ย่อมาจาก Economic and Social Council","refs":["un"],"subject":"th","level":1},{"question":"สนธิสัญญาที่ใช้กับงานด้านวีซ่าและการช่วยเหลือคนชาติในต่างประเทศโดยตรงคือฉบับใด?","answer":"อนุสัญญากรุงเวียนนาว่าด้วยความสัมพันธ์ทางกงสุล ค.ศ. 1963","options":["อนุสัญญากรุงเวียนนาว่าด้วยความสัมพันธ์ทางกงสุล ค.ศ. 1963","อนุสัญญากรุงเวียนนาว่าด้วยความสัมพันธ์ทางการทูต ค.ศ. 1961","อนุสัญญากรุงเวียนนาว่าด้วยกฎหมายสนธิสัญญา ค.ศ. 1969"],"explanation":"หน้าที่กงสุลอยู่ในข้อ 5 ของอนุสัญญา ค.ศ. 1963","refs":["consular"],"subject":"th","level":1},{"question":"ข้อใดเป็นตัวอย่างการระงับข้อพิพาทโดยสันติภายใต้กฎบัตร UN?","answer":"การไกล่เกลี่ย","options":["การไกล่เกลี่ย","การยึดทรัพย์ทางเศรษฐกิจโดยอัตโนมัติ","การตัดความสัมพันธ์ทางทูต"],"explanation":"ข้อ 33 ระบุวิธี เช่น เจรจา ไกล่เกลี่ย อนุญาโตตุลาการ และการระงับข้อพิพาททางศาล","refs":["un"],"subject":"th","level":1},{"question":"กฎหมายทะเลระหว่างประเทศฉบับใดกำหนดกรอบเรื่องทะเลอาณาเขตและเขตเศรษฐกิจจำเพาะ?","answer":"UNCLOS","options":["UNCLOS","UNFCCC","อนุสัญญาว่าด้วยความหลากหลายทางชีวภาพ"],"explanation":"UNCLOS คืออนุสัญญาสหประชาชาติว่าด้วยกฎหมายทะเล","refs":["sea"],"subject":"th","level":1},{"question":"รัฐชายฝั่งกำหนดความกว้างทะเลอาณาเขตได้ไม่เกินเท่าใดจากเส้นฐาน?","answer":"12 ไมล์ทะเล","options":["12 ไมล์ทะเล","24 ไมล์ทะเล","200 ไมล์ทะเล"],"explanation":"ข้อ 3 ของ UNCLOS กำหนดเพดาน 12 ไมล์ทะเล","refs":["sea"],"subject":"th","level":1},{"question":"เอกสิทธิ์และความคุ้มกันทางการทูตมุ่งให้เกิดผลใด?","answer":"ให้คณะผู้แทนทางการทูตปฏิบัติหน้าที่ได้อย่างมีประสิทธิภาพ","options":["ให้คณะผู้แทนทางการทูตปฏิบัติหน้าที่ได้อย่างมีประสิทธิภาพ","ยกเว้นหน้าที่เคารพกฎหมายของรัฐผู้รับ","โอนอำนาจตุลาการของรัฐผู้รับไปยังรัฐผู้ส่งทั้งหมด"],"explanation":"อารัมภบทของอนุสัญญา ค.ศ. 1961 อธิบายวัตถุประสงค์ด้านการทำหน้าที่ของคณะผู้แทน","refs":["vienna"],"subject":"th","level":1},{"question":"Please send the documents ___ Friday at the latest.","answer":"by","options":["by","since","during"],"explanation":"“By” sets the latest acceptable time.","refs":[],"subject":"en","level":1},{"question":"Choose the natural phrase. “The embassy ___ assistance to stranded travelers.”","answer":"provided","options":["provided","performed","committed"],"explanation":"“Provide assistance” is the usual collocation.","refs":[],"subject":"en","level":1},{"question":"The organization works ___ governments to improve access to services.","answer":"with","options":["with","at","during"],"explanation":"Here “with” identifies partners.","refs":[],"subject":"en","level":1},{"question":"The members ___ their decision after a short break.","answer":"announced","options":["announced","announcement","announcing"],"explanation":"The sentence needs a finite verb.","refs":[],"subject":"en","level":1},{"question":"Which word best fits? “The parties reached an ___ after two days of talks.”","answer":"agreement","options":["agreement","agree","agreeable"],"explanation":"The article “an” introduces a singular noun.","refs":[],"subject":"en","level":1},{"question":"“The copies are identical.” What does “identical” mean?","answer":"Exactly the same","options":["Exactly the same","Equally important","Related but different"],"explanation":"“Identical” stresses sameness.","refs":[],"subject":"en","level":1},{"question":"Which sentence keeps the meaning of “The office is closed on Sundays”?","answer":"The office does not open on Sundays.","options":["The office does not open on Sundays.","The office is closed until Sunday.","The office closes only at noon on Sundays."],"explanation":"The sentence describes a recurring Sunday closure.","refs":[],"subject":"en","level":1},{"question":"Choose “fewer” or “less.” “The second round attracted ___ applicants.”","answer":"fewer","options":["fewer","less","least"],"explanation":"Use “fewer” with plural count nouns in formal usage.","refs":[],"subject":"en","level":1},{"question":"“Applicants must show an original ID. Photocopies will not be accepted.” What is required?","answer":"The original ID","options":["The original ID","Any printed copy","A photo of the ID on a phone"],"explanation":"The text expressly requires the original.","refs":[],"subject":"en","level":1},{"question":"Which request is most appropriate in a formal email?","answer":"Could you please confirm receipt of the documents?","options":["Could you please confirm receipt of the documents?","You need to tell me you got those papers ASAP.","Got the papers or what?"],"explanation":"The first version is clear and courteous.","refs":[],"subject":"en","level":1},{"question":"มาตรการใดเป็นภาษีศุลกากรนำเข้า?","answer":"เรียกเก็บร้อยละ 10 ของมูลค่าสินค้านำเข้า","options":["เรียกเก็บร้อยละ 10 ของมูลค่าสินค้านำเข้า","จำกัดการนำเข้ารวมที่ 10,000 ตันต่อปี","กำหนดฉลากคำเตือนให้สินค้าทุกแหล่งผลิต"],"explanation":"ภาษีศุลกากรเป็นการเรียกเก็บอากร ส่วนโควตาจำกัดปริมาณ","refs":["wtoGloss"],"subject":"th","level":1},{"question":"ข้อใดเป็นตัวอย่างของโควตานำเข้า?","answer":"กำหนดเพดานปริมาณนำเข้ารายปี","options":["กำหนดเพดานปริมาณนำเข้ารายปี","ลดอากรสำหรับสินค้าตามพิกัด","เปลี่ยนวิธีคำนวณมูลค่าศุลกากร"],"explanation":"โควตากำกับปริมาณสินค้าที่อนุญาตให้นำเข้า","refs":["wtoGloss"],"subject":"th","level":1},{"question":"FTA ย่อมาจากอะไร?","answer":"Free Trade Agreement","options":["Free Trade Agreement","Foreign Tax Arrangement","Financial Transparency Accord"],"explanation":"คือความตกลงการค้าเสรีระหว่างคู่ภาคี","refs":["rcep"],"subject":"th","level":1},{"question":"สมาชิก APEC ใช้คำเรียกรวมว่าอะไร?","answer":"เขตเศรษฐกิจสมาชิก","options":["เขตเศรษฐกิจสมาชิก","รัฐภาคีสนธิสัญญา APEC","เขตศุลกากรเดียว"],"explanation":"APEC ใช้คำว่า member economies","refs":["apec"],"subject":"th","level":1},{"question":"ข้อใดเป็นงานหลักของ IMF?","answer":"ติดตามนโยบายเศรษฐกิจและสนับสนุนเสถียรภาพทางการเงิน","options":["ติดตามนโยบายเศรษฐกิจและสนับสนุนเสถียรภาพทางการเงิน","วินิจฉัยคดีละเมิดกฎหมายทะเล","ออกใบรับรองถิ่นกำเนิดสินค้า"],"explanation":"IMF ทำงานด้านการติดตาม ให้ความช่วยเหลือทางการเงิน และเสริมขีดความสามารถ","refs":["imf"],"subject":"th","level":1},{"question":"ถ้าค่าเงินเปลี่ยนจาก 35 เป็น 37 บาทต่อดอลลาร์ บาทเปลี่ยนอย่างไรเมื่อเทียบกับดอลลาร์?","answer":"เงินบาทอ่อนค่า","options":["เงินบาทอ่อนค่า","เงินบาทแข็งค่า","สรุปทิศทางไม่ได้แม้หน่วยเท่าเดิม"],"explanation":"ต้องใช้เงินบาทมากขึ้นเพื่อซื้อหนึ่งดอลลาร์","refs":["fx"],"subject":"th","level":1},{"question":"ความตกลงปารีสเกี่ยวข้องกับประเด็นใดโดยตรง?","answer":"การเปลี่ยนแปลงสภาพภูมิอากาศ","options":["การเปลี่ยนแปลงสภาพภูมิอากาศ","การจัดสรรโควตาประมงทุกมหาสมุทร","การระงับข้อพิพาทการค้าระหว่างประเทศ"],"explanation":"ความตกลงเป็นกรอบความร่วมมือด้านภูมิอากาศภายใต้ UNFCCC","refs":["paris"],"subject":"th","level":1},{"question":"โครงการยกระดับเขื่อนป้องกันน้ำท่วมเมืองชายฝั่งเป็นตัวอย่างของอะไร?","answer":"การปรับตัวต่อผลกระทบจากสภาพภูมิอากาศ","options":["การปรับตัวต่อผลกระทบจากสภาพภูมิอากาศ","การกำหนดราคาคาร์บอน","การลดก๊าซจากการผลิตไฟฟ้า"],"explanation":"เป้าหมายของมาตรการคือรับมือผลกระทบจากน้ำท่วม","refs":["paris"],"subject":"th","level":1},{"question":"การเปลี่ยนไปใช้ไฟฟ้าจากพลังงานสะอาดเพื่อลดการปล่อยเป็นตัวอย่างของอะไร?","answer":"การลดการปล่อยก๊าซเรือนกระจก","options":["การลดการปล่อยก๊าซเรือนกระจก","การปรับตัวต่อระดับน้ำทะเลสูงขึ้น","การประเมินความเสียหายหลังเกิดภัย"],"explanation":"การลดการปล่อยเรียกว่า mitigation ในบริบทภูมิอากาศ","refs":["paris"],"subject":"th","level":1},{"question":"SDG 13 กล่าวถึงเรื่องใด?","answer":"การรับมือการเปลี่ยนแปลงสภาพภูมิอากาศ","options":["การรับมือการเปลี่ยนแปลงสภาพภูมิอากาศ","การขจัดความยากจน","ความเสมอภาคระหว่างเพศ"],"explanation":"SDG 13 คือ Climate Action ส่วนอีกสองเรื่องอยู่ใน SDG 1 และ 5","refs":["sdg"],"subject":"th","level":1},{"question":"Imports rose ___ 5 percent last year.","answer":"by","options":["by","with","at"],"explanation":"“Rose by” gives the amount of change.","refs":[],"subject":"en","level":1},{"question":"The price rose from $10 ___ $12.","answer":"to","options":["to","at","for"],"explanation":"“From … to” identifies starting and ending values.","refs":[],"subject":"en","level":1},{"question":"What does “shortage” mean?","answer":"An insufficient supply","options":["An insufficient supply","A higher price than expected","A delay in repayment"],"explanation":"A shortage occurs when supply is insufficient for a need.","refs":[],"subject":"en","level":1},{"question":"“Trade declined because demand fell.” Which relationship is stated?","answer":"Falling demand was the reason for the decline.","options":["Falling demand was the reason for the decline.","The decline caused demand to rise.","Both happened at the same time but no cause is stated."],"explanation":"“Because” introduces the stated reason.","refs":[],"subject":"en","level":1},{"question":"Which word fits? “The report includes an ___ of the costs.”","answer":"estimate","options":["estimate","estimating","estimated"],"explanation":"“An estimate” is an approximate calculation.","refs":[],"subject":"en","level":1},{"question":"The city introduced a plan ___ reduce flood damage.","answer":"to","options":["to","for","because"],"explanation":"A to-infinitive expresses the plan’s purpose here.","refs":[],"subject":"en","level":1},{"question":"Which word means the opposite of “temporary”?","answer":"permanent","options":["permanent","available","gradual"],"explanation":"Temporary is limited in duration. Permanent is lasting.","refs":[],"subject":"en","level":1},{"question":"Which version uses “apply” correctly?","answer":"The new rules apply to all suppliers.","options":["The new rules apply to all suppliers.","The new rules apply all suppliers.","The new rules applies to all suppliers."],"explanation":"Use “apply to” with the group subject to a rule.","refs":[],"subject":"en","level":1},{"question":"“Exports fell in April but recovered in May.” What does “recovered” suggest?","answer":"They rose again after falling.","options":["They rose again after falling.","They fell for a second month.","They stayed exactly the same."],"explanation":"“Recover” indicates a return toward an earlier level.","refs":[],"subject":"en","level":1},{"question":"“The fee is waived for students.” What does that mean?","answer":"Students do not have to pay the fee.","options":["Students do not have to pay the fee.","Students must pay in advance.","Students receive a larger fee."],"explanation":"To waive a fee is to give up the requirement to pay it.","refs":[],"subject":"en","level":1},{"question":"หน่วยงานใดรับผิดชอบงานหนังสือเดินทางในกระทรวงการต่างประเทศ?","answer":"กรมการกงสุล","options":["กรมการกงสุล","กรมพิธีการทูต","กรมองค์การระหว่างประเทศ"],"explanation":"งานหนังสือเดินทางอยู่ในภารกิจด้านกงสุล","refs":["thaiConsul"],"subject":"th","level":1},{"question":"เมื่อคนไทยในต่างประเทศต้องการความช่วยเหลือฉุกเฉินจากทางการไทย ควรติดต่อหน่วยงานใด?","answer":"สถานเอกอัครราชทูตหรือสถานกงสุลไทยที่รับผิดชอบพื้นที่","options":["สถานเอกอัครราชทูตหรือสถานกงสุลไทยที่รับผิดชอบพื้นที่","สำนักงานเลขาธิการ UN ที่อยู่ใกล้ที่สุด","สถานทูตของประเทศนั้นในกรุงเทพฯ เท่านั้น"],"explanation":"สถานทูตและสถานกงสุลไทยเป็นช่องทางสำหรับความช่วยเหลือกงสุลในพื้นที่","refs":["thaiConsul"],"subject":"th","level":1},{"question":"ภารกิจใดสัมพันธ์กับกรมสนธิสัญญาและกฎหมายโดยตรงที่สุด?","answer":"พิจารณาประเด็นกฎหมายระหว่างประเทศที่เกี่ยวข้องกับสนธิสัญญา","options":["พิจารณาประเด็นกฎหมายระหว่างประเทศที่เกี่ยวข้องกับสนธิสัญญา","ออกหนังสือเดินทางทั่วไป","ประสานการจัดลำดับอาวุโสในพิธีการทูต"],"explanation":"กรมนี้มีภารกิจด้านสนธิสัญญาและกฎหมายระหว่างประเทศ","refs":["thaiTreaty"],"subject":"th","level":1},{"question":"กรณีผู้แทนไทยไปเจรจากับรัฐบาลประเทศเดียว จัดเป็นการหารือแบบใด?","answer":"ทวิภาคี","options":["ทวิภาคี","ไตรภาคี","พหุภาคีในกรอบองค์การระหว่างประเทศ"],"explanation":"ทวิภาคีหมายถึงการดำเนินงานระหว่างสองฝ่าย","refs":["myanmar"],"subject":"th","level":1},{"question":"ไทยใช้ชื่อใดในช่วงเข้าเป็นสมาชิกสหประชาชาติเมื่อปี 1946?","answer":"สยาม","options":["สยาม","ราชอาณาจักรอยุธยา","ประเทศไทยในชื่อภาษาอังกฤษว่า Thai Federation"],"explanation":"เอกสารสมัชชาใหญ่ใช้ชื่อ Siam","refs":["thaiun"],"subject":"th","level":1},{"question":"เมืองประวัติศาสตร์ใดเป็นอดีตราชธานีของสยามและขึ้นทะเบียนเป็นมรดกโลก?","answer":"พระนครศรีอยุธยา","options":["พระนครศรีอยุธยา","ลพบุรี","พิษณุโลก"],"explanation":"UNESCO ขึ้นทะเบียน Historic City of Ayutthaya ในปี 1991","refs":["ayutthaya"],"subject":"th","level":1},{"question":"สงกรานต์ได้รับการขึ้นทะเบียนโดย UNESCO ในฐานะอะไร?","answer":"ประเพณีปีใหม่ไทยในบัญชีมรดกวัฒนธรรมที่จับต้องไม่ได้","options":["ประเพณีปีใหม่ไทยในบัญชีมรดกวัฒนธรรมที่จับต้องไม่ได้","โบราณสถานในบัญชีมรดกโลก","เขตสงวนชีวมณฑล"],"explanation":"การขึ้นทะเบียนเป็นการรับรององค์ประกอบของวัฒนธรรมที่มีชีวิต","refs":["songkran"],"subject":"th","level":1},{"question":"ข้อใดเป็นงานกงสุลที่เห็นได้ชัด?","answer":"ช่วยประสานงานเมื่อคนชาติทำหนังสือเดินทางสูญหาย","options":["ช่วยประสานงานเมื่อคนชาติทำหนังสือเดินทางสูญหาย","เจรจาร่างมติคณะมนตรีความมั่นคง","ออกเสียงแทนรัฐอื่นในองค์การระหว่างประเทศ"],"explanation":"งานด้านเอกสารเดินทางและความช่วยเหลือคนชาติเป็นหน้าที่กงสุล","refs":["consular"],"subject":"th","level":1},{"question":"ในการเข้าพบรัฐบาลต่างประเทศเพื่อเจรจาความร่วมมือ ผู้แทนทางการทูตทำหน้าที่ใด?","answer":"เจรจากับรัฐบาลรัฐผู้รับในนามรัฐผู้ส่ง","options":["เจรจากับรัฐบาลรัฐผู้รับในนามรัฐผู้ส่ง","ใช้อำนาจพิจารณาคดีของรัฐผู้รับ","ทำหน้าที่ผู้แทนรัฐบาลรัฐผู้รับ"],"explanation":"การเป็นผู้แทนและการเจรจาอยู่ในข้อ 3 ของอนุสัญญา ค.ศ. 1961","refs":["vienna"],"subject":"th","level":1},{"question":"ราชการส่วนใดในกระทรวงการต่างประเทศเกี่ยวข้องกับงานสหประชาชาติโดยตรงที่สุด?","answer":"กรมองค์การระหว่างประเทศ","options":["กรมองค์การระหว่างประเทศ","กรมพิธีการทูต","กรมการกงสุล"],"explanation":"กรมองค์การระหว่างประเทศรับผิดชอบงานภายใต้กรอบพหุภาคี เช่น UN และสิทธิมนุษยชน","refs":["thaiIO"],"subject":"th","level":1},{"question":"Which option is an appropriate opening to a formal written request?","answer":"I am writing to request further information about the program.","options":["I am writing to request further information about the program.","Hey, send me the program stuff.","You should have sent the information already."],"explanation":"The first version states a clear purpose in a formal register.","refs":[],"subject":"en","level":1},{"question":"The documents ___ ready for collection.","answer":"are","options":["are","is","was"],"explanation":"“Documents” is plural.","refs":[],"subject":"en","level":1},{"question":"Each applicant must bring ___ own pen. Choose the gender-neutral option.","answer":"their","options":["their","them","theirs"],"explanation":"Singular “their” functions as a possessive determiner.","refs":[],"subject":"en","level":1},{"question":"“The consultation was postponed.” What happened?","answer":"It was moved to a later time.","options":["It was moved to a later time.","It was canceled permanently.","It took place earlier than planned."],"explanation":"“Postpone” means reschedule to a later time.","refs":[],"subject":"en","level":1},{"question":"The team reviewed the draft ___ making changes.","answer":"before","options":["before","despite of","because of it"],"explanation":"“Before” can take an -ing clause.","refs":[],"subject":"en","level":1},{"question":"Choose the correct spelling.","answer":"accommodation","options":["accommodation","accomodation","acommodation"],"explanation":"“Accommodation” has double c and double m.","refs":[],"subject":"en","level":1},{"question":"The minister ___ speech was televised arrived early.","answer":"whose","options":["whose","which","whom"],"explanation":"“Whose” marks possession: the minister’s speech.","refs":[],"subject":"en","level":1},{"question":"What does “brief” mean in “a brief meeting”?","answer":"Short","options":["Short","Confidential","Mandatory"],"explanation":"Here “brief” describes duration.","refs":[],"subject":"en","level":1},{"question":"“The queue was shorter after a second desk opened.” Which event happened first?","answer":"A second desk opened.","options":["A second desk opened.","The queue became shorter.","The first desk closed."],"explanation":"“After” places the shorter queue later.","refs":[],"subject":"en","level":1},{"question":"The embassy said it would reply ___ two working days. Which preposition means before the end of that period?","answer":"within","options":["within","beyond","throughout"],"explanation":"“Within” sets an outside time limit.","refs":[],"subject":"en","level":1},{"question":"หากสมาชิกอาเซียนยังเห็นต่าง และยังไม่มีฉันทามติ ข้อ 20 เปิดช่องทางใด?","answer":"ที่ประชุมสุดยอดอาเซียนอาจกำหนดวิธีตัดสินเรื่องนั้น","options":["ที่ประชุมสุดยอดอาเซียนอาจกำหนดวิธีตัดสินเรื่องนั้น","ใช้เสียงข้างมากโดยอัตโนมัติทันที","ให้เลขาธิการลงชี้ขาดด้วยตนเอง"],"explanation":"ข้อ 20(2) ให้อำนาจที่ประชุมสุดยอดพิจารณาวิธีตัดสิน","refs":["charter"],"subject":"th","level":2},{"question":"การแต่งตั้งผู้แทนพิเศษในฉันทามติ 5 ข้อมีบทบาทหลักอย่างไร?","answer":"อำนวยการหารือระหว่างฝ่ายที่เกี่ยวข้อง","options":["อำนวยการหารือระหว่างฝ่ายที่เกี่ยวข้อง","ลงมติมาตรการบังคับโดยลำพัง","รับรองรัฐบาลชั่วคราวในนามทุกประเทศ"],"explanation":"ผู้แทนพิเศษช่วยอำนวยกระบวนการเจรจา","refs":["five"],"subject":"th","level":2},{"question":"หากประเทศคู่เจรจานอกอาเซียนเข้าร่วมเวทีภูมิภาคบางกรอบ การเข้าร่วมบอกอะไรเกี่ยวกับสถานะสมาชิกอาเซียน?","answer":"สถานะคู่เจรจาแยกจากสถานะสมาชิกตามกฎบัตร","options":["สถานะคู่เจรจาแยกจากสถานะสมาชิกตามกฎบัตร","คู่เจรจาได้รับสถานะสมาชิกพร้อมสิทธิออกเสียงทันที","คู่เจรจาคือประเทศผู้ก่อตั้งโดยปริยาย"],"explanation":"กฎบัตรแยกกระบวนการรับสมาชิกออกจากความสัมพันธ์ภายนอก","refs":["charter"],"subject":"th","level":2},{"question":"งานแลกเปลี่ยนข้อมูลวิจัยด้านสาธารณสุขระดับภูมิภาคสอดคล้องกับเสาประชาคมใดโดยตรงที่สุด?","answer":"สังคมและวัฒนธรรม","options":["สังคมและวัฒนธรรม","เศรษฐกิจ","การเมืองและความมั่นคง"],"explanation":"การพัฒนามนุษย์และสาธารณสุขอยู่ในมิติสังคมและวัฒนธรรม","refs":["charter"],"subject":"th","level":2},{"question":"ตลาดภูมิภาคที่มีการประสานมาตรฐานช่วยลดอุปสรรคอะไรได้โดยตรง?","answer":"ภาระการทดสอบหรือรับรองซ้ำในบางกรณี","options":["ภาระการทดสอบหรือรับรองซ้ำในบางกรณี","ความผันผวนของอัตราแลกเปลี่ยนทั้งหมด","ข้อกำหนดให้ต้องยื่นเอกสารการค้าในทุกกรณี"],"explanation":"การประสานหรือยอมรับมาตรฐานช่วยลดต้นทุนที่เกิดจากข้อกำหนดซ้ำซ้อน","refs":["wtoGloss"],"subject":"th","level":2},{"question":"เมื่อไทยเป็นเจ้าภาพ APEC และผลักดัน Bangkok Goals on BCG ข้อใดระบุปีและเวทีถูกต้อง?","answer":"ปี 2565 ในกรอบ APEC","options":["ปี 2565 ในกรอบ APEC","ปี 2565 ในกรอบ UNGA","ปี 2566 ในกรอบ WTO"],"explanation":"เป้าหมายกรุงเทพฯ เป็นผลจากการเป็นเจ้าภาพ APEC ของไทยในปี 2022","refs":["bcg"],"subject":"th","level":2},{"question":"เมื่อกฎหมายอาเซียนถูกใช้ในระดับประเทศ ข้อ 5(2) ของกฎบัตรกล่าวถึงหน้าที่ใด?","answer":"สมาชิกใช้มาตรการที่จำเป็น รวมทั้งกฎหมายภายในที่เหมาะสม เพื่อปฏิบัติตามพันธกรณี","options":["สมาชิกใช้มาตรการที่จำเป็น รวมทั้งกฎหมายภายในที่เหมาะสม เพื่อปฏิบัติตามพันธกรณี","เลขาธิการอาเซียนออกกฎหมายภายในให้สมาชิกได้โดยตรง","สมาชิกทุกประเทศต้องใช้ประมวลกฎหมายฉบับเดียวกัน"],"explanation":"สมาชิกมีความรับผิดชอบในการดำเนินการภายในประเทศ","refs":["charter"],"subject":"th","level":2},{"question":"กรอบ ASEAN Community Vision 2045 มีหน้าที่โดยหลักอย่างไร?","answer":"เป็นกรอบวิสัยทัศน์ระยะยาวของประชาคมอาเซียน","options":["เป็นกรอบวิสัยทัศน์ระยะยาวของประชาคมอาเซียน","เป็นวิธีคิดภาษีศุลกากรสำหรับสินค้าเฉพาะรายการ","เป็นความตกลงเขตแดนระหว่างไทยกับประเทศเพื่อนบ้าน"],"explanation":"วิสัยทัศน์กำหนดทิศทางร่วมระดับประชาคมถึงปี 2045","refs":["vision"],"subject":"th","level":2},{"question":"หากผู้นำต้องการหารือยุทธศาสตร์ภูมิภาคกับคู่เจรจาระดับผู้นำ เวทีใดเหมาะกว่า ARF?","answer":"East Asia Summit","options":["East Asia Summit","ASEAN Secretariat","AHA Centre"],"explanation":"EAS เป็นเวทีหารือระดับผู้นำด้านประเด็นยุทธศาสตร์","refs":["external"],"subject":"th","level":2},{"question":"ในกรณีภัยพิบัติ กลไก AHA Centre ควรเข้าใจอย่างไร?","answer":"ทำหน้าที่ประสานความร่วมมือและการสนับสนุนในภูมิภาค","options":["ทำหน้าที่ประสานความร่วมมือและการสนับสนุนในภูมิภาค","รับอำนาจบริหารราชการของพื้นที่ประสบภัย","กำหนดข้อยกเว้นภาษีให้สินค้านำเข้าทุกประเทศ"],"explanation":"ศูนย์สนับสนุนการประสานงานและการตอบสนองร่วม","refs":["aha"],"subject":"th","level":2},{"question":"Choose the most precise connector. “The timetable was feasible. ___, several delegations objected to the short notice.”","answer":"Nevertheless","options":["Nevertheless","Consequently","For instance"],"explanation":"The second sentence contrasts with the first.","refs":[],"subject":"en","level":2},{"question":"The members were invited to comment ___ the revised proposal.","answer":"on","options":["on","of","by"],"explanation":"“Comment on” introduces the subject of a comment.","refs":[],"subject":"en","level":2},{"question":"What does “endorse” mean in “The leaders endorsed the roadmap”?","answer":"Express approval or support for","options":["Express approval or support for","Reject after review","Promise to fund in full"],"explanation":"Endorsing expresses support; it does not by itself promise funding.","refs":[],"subject":"en","level":2},{"question":"Which sentence uses parallel structure?","answer":"The team aims to collect data, compare results, and publish findings.","options":["The team aims to collect data, compare results, and publish findings.","The team aims to collect data, comparing results, and publication of findings.","The team aims to collect data, to compare results, and publishing findings."],"explanation":"The three coordinated verbs share the same form.","refs":[],"subject":"en","level":2},{"question":"Choose the best tense. “By the time talks resumed, both parties ___ the draft.”","answer":"had reviewed","options":["had reviewed","review","will have reviewed"],"explanation":"The past perfect places review before a specified past event.","refs":[],"subject":"en","level":2},{"question":"“The agreement covers goods, but its services chapter has yet to enter into force.” What is clear?","answer":"The services chapter has not yet entered into force.","options":["The services chapter has not yet entered into force.","The services chapter already applies.","The entire agreement has been terminated."],"explanation":"The statement limits the pending status to the services chapter.","refs":[],"subject":"en","level":2},{"question":"Which is the closest paraphrase? “Unless new evidence emerges, the decision will stand.”","answer":"The decision will remain unless there is new evidence.","options":["The decision will remain unless there is new evidence.","The decision will automatically change if there is no new evidence.","The decision has already changed because of new evidence."],"explanation":"“Unless” introduces the exception to the stated outcome.","refs":[],"subject":"en","level":2},{"question":"The proposal was deferred ___ a further round of consultations.","answer":"pending","options":["pending","notwithstanding of","whereas"],"explanation":"“Pending” means while awaiting something.","refs":[],"subject":"en","level":2},{"question":"“Although all delegations attended, not all were authorized to vote.” What is supported?","answer":"At least one attending delegation could not vote.","options":["At least one attending delegation could not vote.","No delegations could vote.","Only delegations with votes attended."],"explanation":"“Not all” excludes at least one without saying how many.","refs":[],"subject":"en","level":2},{"question":"Choose the closest meaning of “following consultations.”","answer":"After consultations","options":["After consultations","Despite consultations","Instead of consultations"],"explanation":"“Following” indicates time sequence in this phrase.","refs":[],"subject":"en","level":2},{"question":"เมื่อเอกอัครราชทูตได้รับแต่งตั้งใหม่ รัฐผู้ส่งต้องขอความเห็นชอบใดจากรัฐผู้รับก่อน?","answer":"Agrément","options":["Agrément","Exequatur สำหรับหัวหน้าสถานกงสุล","การให้สัตยาบันสนธิสัญญา"],"explanation":"ข้อ 4 ของอนุสัญญา ค.ศ. 1961 กล่าวถึง agrément ของหัวหน้าคณะผู้แทน","refs":["vienna"],"subject":"th","level":2},{"question":"เมื่อรัฐผู้รับประกาศนักการทูตเป็น persona non grata ผลตามอนุสัญญาคืออะไร?","answer":"รัฐผู้ส่งต้องเรียกตัวกลับหรือยุติหน้าที่ของบุคคลนั้นในคณะผู้แทน","options":["รัฐผู้ส่งต้องเรียกตัวกลับหรือยุติหน้าที่ของบุคคลนั้นในคณะผู้แทน","รัฐผู้รับต้องรอให้คณะมนตรีความมั่นคงมีมติ","การประกาศทำให้อนุสัญญาสิ้นผลระหว่างสองรัฐ"],"explanation":"ข้อ 9 กำหนดทางเลือกแก่รัฐผู้ส่งโดยรัฐผู้รับไม่จำเป็นต้องชี้แจงเหตุผล","refs":["vienna"],"subject":"th","level":2},{"question":"คนสัญชาติต่างชาติถูกควบคุมตัว ข้อ 36 ของอนุสัญญากงสุลกำหนดให้แจ้งสถานกงสุลเมื่อใด?","answer":"แจ้งโดยไม่ชักช้าหากผู้ถูกควบคุมตัวร้องขอ","options":["แจ้งโดยไม่ชักช้าหากผู้ถูกควบคุมตัวร้องขอ","แจ้งเมื่อศาลตัดสินคดีแล้วเท่านั้น","แจ้งเฉพาะเมื่อมีคำสั่งของสหประชาชาติ"],"explanation":"เจ้าหน้าที่ต้องแจ้งสิทธิดังกล่าวแก่ผู้ถูกควบคุมตัวโดยไม่ชักช้าด้วย","refs":["consular"],"subject":"th","level":2},{"question":"คณะมนตรีความมั่นคงมีมติใช้มาตรการเศรษฐกิจโดยไม่ใช้กำลัง กฎบัตรข้อใดเกี่ยวข้องโดยตรง?","answer":"ข้อ 41","options":["ข้อ 41","ข้อ 33","ข้อ 51"],"explanation":"ข้อ 41 ครอบคลุมมาตรการที่ไม่เกี่ยวกับการใช้กำลังทหาร","refs":["un"],"subject":"th","level":2},{"question":"มติเชิงกระบวนการของคณะมนตรีความมั่นคงต้องได้เสียงเห็นชอบอย่างน้อยกี่เสียง?","answer":"9 เสียง","options":["9 เสียง","8 เสียง","10 เสียง"],"explanation":"ข้อ 27(2) กำหนดเสียงเห็นชอบ 9 เสียงสำหรับเรื่องเชิงกระบวนการ","refs":["un"],"subject":"th","level":2},{"question":"ข้อใดเป็นตัวอย่างพื้นฐานของ consent ต่อเขตอำนาจ ICJ ในคดีพิพาท?","answer":"ทั้งสองรัฐทำความตกลงพิเศษให้นำข้อพิพาทขึ้นศาล","options":["ทั้งสองรัฐทำความตกลงพิเศษให้นำข้อพิพาทขึ้นศาล","รัฐผู้ร้องเป็นสมาชิก UN เพียงอย่างเดียว","สื่อมวลชนของทั้งสองรัฐรายงานตรงกัน"],"explanation":"Special agreement เป็นหนึ่งในฐานความยินยอมต่ออำนาจศาล","refs":["icj"],"subject":"th","level":2},{"question":"เขตต่อเนื่องตาม UNCLOS ขยายออกได้ไกลสุดเท่าใดจากเส้นฐาน?","answer":"24 ไมล์ทะเล","options":["24 ไมล์ทะเล","จากขอบทะเลอาณาเขตออกไปอีก 24 ไมล์ทะเล","200 ไมล์ทะเล"],"explanation":"ข้อ 33 วัดเพดานจากเส้นฐานเดียวกับทะเลอาณาเขต","refs":["sea"],"subject":"th","level":2},{"question":"ใน EEZ รัฐชายฝั่งมีสิทธิแบบใดเกี่ยวกับทรัพยากร?","answer":"สิทธิอธิปไตยเพื่อสำรวจ ใช้ประโยชน์ อนุรักษ์ และจัดการทรัพยากร","options":["สิทธิอธิปไตยเพื่อสำรวจ ใช้ประโยชน์ อนุรักษ์ และจัดการทรัพยากร","อธิปไตยเหนือการเดินเรือทั้งหมดเช่นในน่านน้ำภายใน","สิทธิออกสัญชาติให้เรือต่างชาติได้ฝ่ายเดียว"],"explanation":"ข้อ 56 กำหนด sovereign rights เพื่อวัตถุประสงค์ที่กำหนด","refs":["sea"],"subject":"th","level":2},{"question":"ความตกลงหนึ่งเปิดให้รัฐที่ไม่ได้ลงนามแต่แรกเข้าร่วมภายหลัง การเข้าร่วมโดยทั่วไปเรียกว่าอะไร?","answer":"ภาคยานุวัติ (accession)","options":["ภาคยานุวัติ (accession)","การรับรองความถูกต้องของตัวบท (authentication)","การตั้งข้อสงวน (reservation)"],"explanation":"ภาคยานุวัติเป็นวิธีแสดงความยินยอมผูกพันเมื่อมีเงื่อนไขรองรับ","refs":["vclt"],"subject":"th","level":2},{"question":"หลัก pacta sunt servanda หมายถึงอะไร?","answer":"สนธิสัญญาที่มีผลใช้บังคับผูกพันภาคีและต้องปฏิบัติโดยสุจริต","options":["สนธิสัญญาที่มีผลใช้บังคับผูกพันภาคีและต้องปฏิบัติโดยสุจริต","เมื่อรัฐบาลเปลี่ยน สนธิสัญญาสิ้นสุดโดยอัตโนมัติ","สนธิสัญญามีผลย้อนหลังเสมอ"],"explanation":"เป็นหลักในข้อ 26 ของอนุสัญญากฎหมายสนธิสัญญา","refs":["vclt"],"subject":"th","level":2},{"question":"The report, along with its annexes, ___ available online.","answer":"is","options":["is","are","were"],"explanation":"The main subject “report” is singular. The phrase “along with” does not change agreement.","refs":[],"subject":"en","level":2},{"question":"The director insisted that the original records ___ retained.","answer":"be","options":["be","are being","were"],"explanation":"The mandative clause uses the base form “be,” here in a passive construction.","refs":[],"subject":"en","level":2},{"question":"What does “waive” mean in “The sending State may waive immunity”?","answer":"Formally give up the protection","options":["Formally give up the protection","Extend the protection indefinitely","Transfer the protection to another person"],"explanation":"“Waive” is to relinquish a right, requirement, or protection.","refs":[],"subject":"en","level":2},{"question":"Choose the most precise word. “The rules apply to members and are legally ___ on them.”","answer":"binding","options":["binding","bound","bind"],"explanation":"“Legally binding” describes obligations that have legal force.","refs":[],"subject":"en","level":2},{"question":"Choose the appropriate phrase. “The notification must be sent ___ accordance with the agreed procedure.”","answer":"in","options":["in","by","with"],"explanation":"The established phrase is “in accordance with.”","refs":[],"subject":"en","level":2},{"question":"Which wording preserves the meaning? “The court lacks jurisdiction unless both states consent.”","answer":"Consent from both states is necessary for jurisdiction in this example.","options":["Consent from both states is necessary for jurisdiction in this example.","Consent from either state alone establishes jurisdiction.","The court has jurisdiction even without consent."],"explanation":"The sentence states a necessary condition in the example.","refs":[],"subject":"en","level":2},{"question":"“The ruling addresses admissibility. It does not decide the merits.” What did the court leave undecided?","answer":"The substantive claims","options":["The substantive claims","Whether the ruling exists","Which language the filing used"],"explanation":"“Merits” concern the substance of the case.","refs":[],"subject":"en","level":2},{"question":"Choose the closest synonym for “pursuant to” in “pursuant to Article 5.”","answer":"Under","options":["Under","Despite","Apart from"],"explanation":"“Pursuant to” means acting under or in compliance with a provision.","refs":[],"subject":"en","level":2},{"question":"“The change takes effect upon publication.” When does it take effect?","answer":"When it is published","options":["When it is published","When the draft is written","Before it is published"],"explanation":"“Upon” means at the time of the stated event here.","refs":[],"subject":"en","level":2},{"question":"The two instruments differ ___ scope and purpose.","answer":"in","options":["in","to","with"],"explanation":"“Differ in” introduces the characteristics that vary.","refs":[],"subject":"en","level":2},{"question":"ถ้ารัฐลดอากรสินค้าจากคู่ค้า A เท่านั้น ภายใต้หลัก MFN ควรตรวจอะไรต่อ?","answer":"สิทธินั้นต้องขยายไปยังสมาชิกอื่นหรือเข้าเงื่อนไขข้อยกเว้นที่ใช้ได้หรือไม่","options":["สิทธินั้นต้องขยายไปยังสมาชิกอื่นหรือเข้าเงื่อนไขข้อยกเว้นที่ใช้ได้หรือไม่","สินค้าจาก A ขายในราคาเดียวกับสินค้าท้องถิ่นหรือไม่เท่านั้น","ธนาคารกลาง A ใช้สกุลเงินอะไร"],"explanation":"MFN เปรียบเทียบการปฏิบัติต่อคู่ค้าต่างประเทศ","refs":["trade"],"subject":"th","level":2},{"question":"ถ้าสินค้านำเข้าผ่านศุลกากรแล้วเสียภาษีสรรพสามิตมากกว่าสินค้าในประเทศที่เหมือนกัน ประเด็นหลักคืออะไร?","answer":"การปฏิบัติเยี่ยงคนชาติ (National Treatment)","options":["การปฏิบัติเยี่ยงคนชาติ (National Treatment)","กฎถิ่นกำเนิดสินค้าแบบสะสม","สิทธิออกเสียงใน WTO"],"explanation":"เป็นการเปรียบเทียบภาษีภายในของสินค้านำเข้ากับสินค้าในประเทศ","refs":["trade"],"subject":"th","level":2},{"question":"ถ้าผู้ส่งออกต้องการอัตราภาษีพิเศษตาม FTA สิ่งใดต้องตรวจเอกสารก่อน?","answer":"ว่าสินค้าเข้าเกณฑ์ถิ่นกำเนิดตามความตกลงหรือไม่","options":["ว่าสินค้าเข้าเกณฑ์ถิ่นกำเนิดตามความตกลงหรือไม่","ผู้ค้าจดทะเบียนในตลาดหลักทรัพย์หรือไม่","เรือขนส่งชักธงประเทศคู่ภาคีหรือไม่เสมอ"],"explanation":"สิทธิพิเศษขึ้นกับกฎถิ่นกำเนิด ยืนยันจากหลักฐานที่ความตกลงกำหนด","refs":["rcep"],"subject":"th","level":2},{"question":"การทุ่มตลาดพิจารณาความแตกต่างของราคาส่งออกกับอะไร?","answer":"มูลค่าปกติของสินค้าตามเกณฑ์ที่กำหนด","options":["มูลค่าปกติของสินค้าตามเกณฑ์ที่กำหนด","อัตราภาษีมูลค่าเพิ่มของผู้นำเข้า","ค่าเงินสำรองของรัฐผู้ส่งออก"],"explanation":"การเปรียบเทียบกับ normal value เป็นองค์ประกอบหลักของ dumping","refs":["wtoGloss"],"subject":"th","level":2},{"question":"ถ้าการนำเข้าเพิ่มขึ้นฉับพลันจนเกิดความเสียหายร้ายแรงต่ออุตสาหกรรมในประเทศ ประเภทมาตรการใดอาจเกี่ยวข้องโดยตรง?","answer":"Safeguard","options":["Safeguard","Anti-dumping โดยต้องสันนิษฐานว่าราคาต่ำกว่ามูลค่าปกติ","มาตรการตอบโต้การอุดหนุนโดยไม่ต้องตรวจเงินอุดหนุน"],"explanation":"Safeguard ใช้พิจารณาการเพิ่มขึ้นของการนำเข้าและความเสียหายร้ายแรงตามเงื่อนไข","refs":["safeguard"],"subject":"th","level":2},{"question":"ค่าเงินอ่อนแต่ราคาส่งออกเป็นดอลลาร์เท่าเดิมและยอดขายคงที่ ผู้ส่งออกได้รับผลเชิงบัญชีอย่างไรเมื่อแปลงเป็นบาท?","answer":"รายได้ต่อหน่วยเป็นบาทเพิ่มขึ้น หากไม่ได้ป้องกันความเสี่ยง","options":["รายได้ต่อหน่วยเป็นบาทเพิ่มขึ้น หากไม่ได้ป้องกันความเสี่ยง","รายได้ต่อหน่วยเป็นบาทลดลง","ต้นทุนวัตถุดิบนำเข้าลดลงโดยอัตโนมัติ"],"explanation":"ดอลลาร์เท่าเดิมแลกกลับได้บาทมากขึ้น แต่ผลกำไรรวมขึ้นกับต้นทุนด้วย","refs":["fx"],"subject":"th","level":2},{"question":"รายการใดโดยทั่วไปอยู่ในบัญชีเดินสะพัด?","answer":"การส่งออกบริการท่องเที่ยว","options":["การส่งออกบริการท่องเที่ยว","การซื้อพันธบัตรต่างประเทศ","การเพิ่มเงินสำรองระหว่างประเทศ"],"explanation":"บัญชีเดินสะพัดรวมสินค้า บริการ และรายได้ปฐมภูมิและทุติยภูมิ","refs":["bop"],"subject":"th","level":2},{"question":"แต่ละภาคีต้องสื่อสาร NDC ใหม่ในรอบใดตามความตกลงปารีส?","answer":"ทุก 5 ปี","options":["ทุก 5 ปี","ทุก 2 ปี","ทุก 10 ปี"],"explanation":"ข้อ 4(9) กำหนดรอบ 5 ปี","refs":["parisText"],"subject":"th","level":2},{"question":"Global Stocktake ในความตกลงปารีสประเมินอะไร?","answer":"ความคืบหน้าร่วมกันเพื่อบรรลุวัตถุประสงค์และเป้าหมายระยะยาว","options":["ความคืบหน้าร่วมกันเพื่อบรรลุวัตถุประสงค์และเป้าหมายระยะยาว","คะแนนการปฏิบัติตามของแต่ละรัฐเพื่อปรับโดยอัตโนมัติ","เงินลงทุนด้านภูมิอากาศของธนาคารเอกชนเท่านั้น"],"explanation":"ข้อ 14 ระบุการประเมินความคืบหน้าในภาพรวม","refs":["parisText"],"subject":"th","level":2},{"question":"รัฐหนึ่งทำแผนรับมือภัยแล้งและลดการใช้ถ่านหิน มาตรการสองอย่างเป็นประเภทใดตามลำดับ?","answer":"Adaptation แล้ว Mitigation","options":["Adaptation แล้ว Mitigation","Mitigation แล้ว Adaptation","ทั้งคู่เป็น Adaptation"],"explanation":"แผนภัยแล้งลดความเปราะบาง ส่วนการลดถ่านหินมุ่งลดการปล่อย","refs":["paris"],"subject":"th","level":2},{"question":"Choose the best connector. “Costs rose ___ demand remained flat.”","answer":"whereas","options":["whereas","therefore","in order to"],"explanation":"“Whereas” contrasts the two trends.","refs":[],"subject":"en","level":2},{"question":"What does “offset” mean in “Higher exports offset the decline in tourism revenue”?","answer":"Counterbalance","options":["Counterbalance","Cause","Predict"],"explanation":"An offsetting increase reduces or cancels the effect of a decline.","refs":[],"subject":"en","level":2},{"question":"“The share rose from 20% to 25%.” What was the change in percentage points?","answer":"5 percentage points","options":["5 percentage points","25 percentage points","20 percentage points"],"explanation":"Subtract the original percentage from the new one.","refs":[],"subject":"en","level":2},{"question":"The agency revised its estimate ___ account for missing data.","answer":"to","options":["to","for","despite"],"explanation":"A to-infinitive gives the purpose of the revision.","refs":[],"subject":"en","level":2},{"question":"“Overall exports increased, although shipments to three major markets fell.” Which conclusion follows?","answer":"Total exports and exports to specific markets moved in different directions.","options":["Total exports and exports to specific markets moved in different directions.","Every export market recorded an increase.","The three markets contributed no exports."],"explanation":"An aggregate increase can coexist with declines in some markets.","refs":[],"subject":"en","level":2},{"question":"Choose the best word. “The new policy is intended to ___ investment.”","answer":"encourage","options":["encourage","endorsement","enforcement"],"explanation":"The verb “encourage” follows “intended to.”","refs":[],"subject":"en","level":2},{"question":"“The initial estimate was revised downward.” What changed?","answer":"The new estimate is lower.","options":["The new estimate is lower.","The true value must be lower.","The estimate was withdrawn and never replaced."],"explanation":"“Downward” describes the revision, not the independently measured true value.","refs":[],"subject":"en","level":2},{"question":"What does “exempt” mean in “Small firms are exempt from the fee”?","answer":"Not required to pay it","options":["Not required to pay it","Allowed to pay it twice","Required to pay before larger firms"],"explanation":"An exemption releases a group from an obligation.","refs":[],"subject":"en","level":2},{"question":"“Prices remained stable despite a decline in output.” What remained stable?","answer":"Prices","options":["Prices","Output","Both output and prices"],"explanation":"The subject of “remained stable” is “prices.”","refs":[],"subject":"en","level":2},{"question":"Which option best completes the sentence? “The report recommends ___ emissions more frequently.”","answer":"monitoring","options":["monitoring","monitor","monitored"],"explanation":"“Recommend” can take an -ing form as its object.","refs":[],"subject":"en","level":2},{"question":"ถ้าข่าวระบุว่าไทยและเมียนมา “เห็นพ้องที่จะจัดประชุมคณะทำงานร่วม” ข้อสรุปใดตรงหลักฐาน?","answer":"มีความตกลงจะประชุม โดยผลของมาตรการยังต้องติดตาม","options":["มีความตกลงจะประชุม โดยผลของมาตรการยังต้องติดตาม","พิสูจน์ได้ว่าคุณภาพน้ำดีขึ้นแล้ว","เกิดสนธิสัญญาที่มีผลใช้บังคับแน่นอน"],"explanation":"ถ้อยคำรายงานขั้นตอนที่ตกลงกันโดยยังไม่มีข้อมูลผลลัพธ์","refs":["myanmar"],"subject":"th","level":2},{"question":"หากต้องเทียบคุณภาพน้ำสองฝั่งแม่น้ำ หลักฐานแบบใดเปรียบเทียบได้มากที่สุด?","answer":"เก็บตัวอย่างจุดและช่วงเวลาที่สอดคล้องกันด้วยวิธีเดียวกัน","options":["เก็บตัวอย่างจุดและช่วงเวลาที่สอดคล้องกันด้วยวิธีเดียวกัน","ใช้ค่าเฉลี่ยปีหนึ่งเทียบกับตัวอย่างหนึ่งวัน","ใช้การวัดคนละหน่วยโดยไม่แปลง"],"explanation":"การตั้งเงื่อนไขการวัดให้สอดคล้องช่วยลดความคลาดเคลื่อน","refs":["myanmar"],"subject":"th","level":2},{"question":"จากการนำเสนอรายงาน UPR ของไทย รอบที่ 4 ข้อใดอธิบายกลไกได้ถูกต้อง?","answer":"รัฐอื่นมีโอกาสตั้งข้อสังเกตและเสนอข้อแนะนำ","options":["รัฐอื่นมีโอกาสตั้งข้อสังเกตและเสนอข้อแนะนำ","คณะทำงานออกคำพิพากษาอาญาต่อบุคคล","คณะมนตรีความมั่นคงใช้สิทธิวีโตต่อรายงานโดยตรง"],"explanation":"UPR เป็นกระบวนการทบทวนระหว่างรัฐสมาชิก","refs":["upr"],"subject":"th","level":2},{"question":"การขึ้นทะเบียนแหล่งโบราณสถานกับประเพณีสงกรานต์ต่างกันในประเด็นใด?","answer":"แหล่งโบราณสถานเป็นทรัพย์สินทางวัฒนธรรม ส่วนสงกรานต์เป็นประเพณีที่ชุมชนสืบทอด","options":["แหล่งโบราณสถานเป็นทรัพย์สินทางวัฒนธรรม ส่วนสงกรานต์เป็นประเพณีที่ชุมชนสืบทอด","ทั้งสองอยู่ในบัญชีมรดกโลกประเภทเดียวกัน","สงกรานต์ได้รับการขึ้นทะเบียนเป็นแหล่งธรรมชาติ"],"explanation":"บัญชีมรดกโลกและบัญชีมรดกที่จับต้องไม่ได้เป็นคนละกรอบ","refs":["songkran","ayutthaya"],"subject":"th","level":2},{"question":"จากข้อมูลของ UNESCO ปัจจัยใดช่วยอธิบายว่าทำไมอยุธยาดึงดูดพ่อค้าต่างชาติ?","answer":"เส้นทางน้ำเชื่อมเมืองกับทะเลและเครือข่ายค้าขาย","options":["เส้นทางน้ำเชื่อมเมืองกับทะเลและเครือข่ายค้าขาย","เป็นเมืองท่ากลางมหาสมุทรโดยไม่มีแม่น้ำ","มีอุปสรรคเดินทางสูงจนการค้าทางไกลหายไป"],"explanation":"ทำเลที่ตั้งช่วยให้เชื่อมการค้าภายในกับการเดินเรือ","refs":["ayutthaya"],"subject":"th","level":2},{"question":"ถ้าต้องสรุปข่าวการทูตสำหรับผู้บริหาร ข้อใดระบุสถานะของข้อมูลได้รัดกุมที่สุด?","answer":"แยกสิ่งที่ประกาศแล้ว สิ่งที่จะดำเนินการ และประเด็นที่ยังต้องยืนยัน","options":["แยกสิ่งที่ประกาศแล้ว สิ่งที่จะดำเนินการ และประเด็นที่ยังต้องยืนยัน","เปลี่ยนคำว่า “จะพิจารณา” เป็น “ได้ดำเนินการแล้ว”","รายงานคำประกาศเป็นผลสัมฤทธิ์ทันที"],"explanation":"การแยกสถานะของข้อเท็จจริงช่วยให้ผู้ใช้ข้อมูลตัดสินใจได้ถูกต้อง","refs":["myanmar"],"subject":"th","level":2},{"question":"เมื่อต้องส่งข่าวสารทางการเกี่ยวกับข้อริเริ่มของกระทรวงให้สาธารณชน งานใดเกี่ยวข้องที่สุด?","answer":"งานสารนิเทศและสื่อสารสาธารณะ","options":["งานสารนิเทศและสื่อสารสาธารณะ","งานออกหนังสือเดินทาง","งานรับรองลายมือชื่อเอกสาร"],"explanation":"งานสื่อสารสาธารณะอยู่ในภารกิจด้านสารนิเทศของกระทรวง","refs":["thaiMfa"],"subject":"th","level":2},{"question":"หากเรื่องหนึ่งเป็นคำร้องประสานความช่วยเหลือคนไทยในต่างประเทศ ควรส่งให้หน่วยงานใดเป็นลำดับต้น?","answer":"หน่วยงานกงสุลไทยที่รับผิดชอบพื้นที่","options":["หน่วยงานกงสุลไทยที่รับผิดชอบพื้นที่","หน่วยงานกฎหมายการค้าของ WTO","หน่วยงานรักษาความปลอดภัยของสหประชาชาติ"],"explanation":"เลือกหน่วยงานจากลักษณะงานและเขตที่รับผิดชอบ","refs":["thaiConsul"],"subject":"th","level":2},{"question":"ข้อใดสะท้อนความแตกต่างระหว่างการประสานงานด้านสนธิสัญญากับการทำงานกงสุล?","answer":"ฝ่ายแรกดูกรอบข้อผูกพันระหว่างประเทศ ฝ่ายหลังอาจช่วยแก้ปัญหาเอกสารเดินทางของประชาชน","options":["ฝ่ายแรกดูกรอบข้อผูกพันระหว่างประเทศ ฝ่ายหลังอาจช่วยแก้ปัญหาเอกสารเดินทางของประชาชน","ทั้งสองฝ่ายทำได้เฉพาะงานออกหนังสือเดินทาง","งานกงสุลทำได้เฉพาะในกรอบ UN"],"explanation":"แต่ละภารกิจต้องส่งให้หน่วยงานที่รับผิดชอบ","refs":["thaiTreaty","thaiConsul"],"subject":"th","level":2},{"question":"รัฐบาลสองฝ่ายเห็นชอบทำงานร่วมกัน แต่ยังไม่ได้ลงนามในเอกสารใด คำบรรยายสั้นใดเหมาะสม?","answer":"ทั้งสองฝ่ายเห็นพ้องในหลักการให้เดินหน้าความร่วมมือ","options":["ทั้งสองฝ่ายเห็นพ้องในหลักการให้เดินหน้าความร่วมมือ","สนธิสัญญามีผลบังคับย้อนหลัง","ฝ่ายหนึ่งให้สัตยาบันแล้วแน่นอน"],"explanation":"ถ้อยคำควรตรงกับระดับความคืบหน้าที่มีหลักฐาน","refs":["myanmar","vclt"],"subject":"th","level":2},{"question":"What does “allocate” mean in “The agency allocated funds to the program”?","answer":"Set aside for a purpose","options":["Set aside for a purpose","Borrow from a supplier","Recover a past debt"],"explanation":"Allocation assigns resources to a use.","refs":[],"subject":"en","level":2},{"question":"Choose the natural phrasing.","answer":"The findings are consistent with the earlier study.","options":["The findings are consistent with the earlier study.","The findings are consistent to the earlier study.","The findings consist with the earlier study."],"explanation":"“Consistent with” means compatible with.","refs":[],"subject":"en","level":2},{"question":"“The ministry declined to comment while the review was underway.” What follows?","answer":"No comment was offered at that time.","options":["No comment was offered at that time.","The ministry rejected every finding in the review.","The ministry confirmed that the review was completed."],"explanation":"Declining to comment does not state a position on the findings.","refs":[],"subject":"en","level":2},{"question":"“She suggested that they ___ the deadline.”","answer":"extend","options":["extend","extends","had extended"],"explanation":"The bare form is standard in the formal mandative construction.","refs":[],"subject":"en","level":2},{"question":"“If the deadline is extended, more applicants ___ be able to submit.”","answer":"may","options":["may","would have","had"],"explanation":"“May” presents a possible future result of a real condition.","refs":[],"subject":"en","level":2},{"question":"Which version is the least ambiguous?","answer":"The embassy will notify applicants by email on Friday.","options":["The embassy will notify applicants by email on Friday.","On Friday, applicants with email were notified it will happen.","The embassy will notify on Friday applicants by email possibly."],"explanation":"The first sentence clearly specifies actor, recipients, medium, and timing.","refs":[],"subject":"en","level":2},{"question":"“The announcement supersedes the earlier guidance.” What does it say about the earlier guidance?","answer":"It has been replaced by the announcement.","options":["It has been replaced by the announcement.","It remains the controlling guidance.","It is a draft of the coming announcement."],"explanation":"“Supersede” means replace in authority or use.","refs":[],"subject":"en","level":2},{"question":"Choose the most precise word. “The report was based on a small, non-random ___.”","answer":"sample","options":["sample","population","census"],"explanation":"A sample is the subset actually observed.","refs":[],"subject":"en","level":2},{"question":"“The interviews illustrate common concerns but were not designed to estimate prevalence.” What can the interviews show?","answer":"Examples of concerns raised in the interviews","options":["Examples of concerns raised in the interviews","A reliable national percentage reporting each concern","That every concern occurs equally often nationwide"],"explanation":"The design supports illustration, not population-level estimates.","refs":[],"subject":"en","level":2},{"question":"Which sentence is most concise without changing the meaning?","answer":"We need to clarify the procedure before implementation.","options":["We need to clarify the procedure before implementation.","A need exists for there to be clarification of the procedure prior to implementation.","Procedures have been clarified during implementation."],"explanation":"The first preserves the timing and meaning while removing needless wording.","refs":[],"subject":"en","level":2},{"question":"สมาชิกอาเซียนหนึ่งประเทศขอเลื่อนการเข้าร่วมมาตรการเศรษฐกิจ ข้อใดอธิบาย ASEAN Minus X ตามกฎบัตรได้ดีที่สุด?","answer":"ใช้ความยืดหยุ่นในการปฏิบัติตามข้อผูกพันทางเศรษฐกิจได้เมื่อมีฉันทามติ","options":["ใช้ความยืดหยุ่นในการปฏิบัติตามข้อผูกพันทางเศรษฐกิจได้เมื่อมีฉันทามติ","บังคับใช้ทุกมติที่มีผู้คัดค้านหนึ่งประเทศได้ทันที","ใช้กับทุกประเด็นการเมืองโดยอัตโนมัติ"],"explanation":"ข้อ 21(2) ระบุขอบเขตเศรษฐกิจและเงื่อนไขฉันทามติ","refs":["charter"],"subject":"th","level":3},{"question":"เมื่อมีการไม่ปฏิบัติตามกฎบัตรอาเซียนอย่างร้ายแรง ควรส่งเรื่องไปที่ใดตามข้อ 20(4)?","answer":"ที่ประชุมสุดยอดอาเซียน","options":["ที่ประชุมสุดยอดอาเซียน","คณะมนตรีความมั่นคง UN โดยอัตโนมัติ","ศาลยุติธรรมระหว่างประเทศโดยไม่ต้องมีฐานอำนาจ"],"explanation":"กฎบัตรกำหนดให้เรื่องการฝ่าฝืนร้ายแรงหรือไม่ปฏิบัติตามส่งถึงที่ประชุมสุดยอด","refs":["charter"],"subject":"th","level":3},{"question":"รัฐคู่เจรจาต้องการเข้าร่วมอาเซียน ข้อใดระบุเงื่อนไขการรับสมาชิกรายใหม่ได้ตรงที่สุด?","answer":"ที่ประชุมสุดยอดตัดสินโดยฉันทามติบนข้อเสนอแนะของคณะมนตรีประสานงานอาเซียน","options":["ที่ประชุมสุดยอดตัดสินโดยฉันทามติบนข้อเสนอแนะของคณะมนตรีประสานงานอาเซียน","เลขาธิการตัดสินโดยให้นับเสียงคู่เจรจา","รัฐผู้สมัครเข้าเป็นสมาชิกได้ทันทีเมื่อเป็นคู่เจรจาครบระยะเวลา"],"explanation":"กฎบัตรข้อ 6 แยกเกณฑ์คุณสมบัติและกระบวนการรับเข้า","refs":["charter"],"subject":"th","level":3},{"question":"สองสมาชิกอาเซียนเห็นต่างเรื่องมาตรฐานหนึ่ง โดยมีทั้งเป้าหมายร่วมและข้อจำกัดการปฏิบัติ ข้อเสนอแรกที่เหมาะสมคืออะไร?","answer":"หารือข้อกังวลและร่างกรอบติดตามที่ทั้งสองฝ่ายตรวจสอบได้","options":["หารือข้อกังวลและร่างกรอบติดตามที่ทั้งสองฝ่ายตรวจสอบได้","ประกาศว่าข้อกังวลหมดไปเพราะมีเป้าหมายร่วม","เสนอให้ตีความความเงียบของอีกฝ่ายเป็นการยอมรับโดยทันที"],"explanation":"การหารือก่อนตัดสินใจช่วยระบุเงื่อนไขที่ทำให้เกิดฉันทามติ","refs":["charter"],"subject":"th","level":3},{"question":"หากต้องประเมินความคืบหน้าด้านมนุษยธรรมตามฉันทามติ 5 ข้อ ตัวชี้วัดใดสะท้อนผลโดยตรงที่สุด?","answer":"สัดส่วนครัวเรือนเป้าหมายที่ได้รับความช่วยเหลือตามเกณฑ์ที่ตรวจสอบได้","options":["สัดส่วนครัวเรือนเป้าหมายที่ได้รับความช่วยเหลือตามเกณฑ์ที่ตรวจสอบได้","จำนวนครั้งที่ออกแถลงการณ์รับรองเป้าหมาย","จำนวนการประชุมที่กำหนดไว้แต่ยังไม่จัด"],"explanation":"วัดการเข้าถึงความช่วยเหลือจริงเพื่อประเมินผลด้านมนุษยธรรม","refs":["five"],"subject":"th","level":3},{"question":"ASEAN เป็นเจ้าภาพเวทีหารือเรื่องความมั่นคงระดับรัฐมนตรีและเวทียุทธศาสตร์ระดับผู้นำ ควรจับคู่ตามลำดับอย่างไร?","answer":"ARF แล้ว EAS","options":["ARF แล้ว EAS","EAS แล้ว ARF","AHA Centre แล้ว APEC"],"explanation":"ARF กับ EAS ต่างกันทั้งระดับผู้เข้าร่วมและบทบาท","refs":["external"],"subject":"th","level":3},{"question":"สถานการณ์สมมติที่ประเทศต้นน้ำและปลายน้ำโต้แย้งสาเหตุของมลพิษ ควรดำเนินการใดก่อนตัดสินข้อกล่าวหา?","answer":"ตกลงแผนเก็บข้อมูลร่วมและกำหนดการตรวจทวนอิสระ","options":["ตกลงแผนเก็บข้อมูลร่วมและกำหนดการตรวจทวนอิสระ","สรุปแหล่งกำเนิดจากข้อมูลเฉลี่ยปลายน้ำเพียงจุดเดียว","ตั้งเงื่อนไขว่าต้องตกลงฝ่ายรับผิดก่อนเก็บตัวอย่าง"],"explanation":"การวัดที่ตรวจสอบได้ช่วยแยกข้อเท็จจริงจากข้อกล่าวหา","refs":["myanmar"],"subject":"th","level":3},{"question":"หากข่าวหนึ่งบอกว่ากลุ่มประเทศ “reaffirmed their commitment” ต่อความตกลง คำอธิบายใดรัดกุมที่สุด?","answer":"กลุ่มยืนยันเจตนารมณ์เดิม ส่วนการเปลี่ยนพันธกรณีต้องตรวจเอกสารที่เกี่ยวข้อง","options":["กลุ่มยืนยันเจตนารมณ์เดิม ส่วนการเปลี่ยนพันธกรณีต้องตรวจเอกสารที่เกี่ยวข้อง","กลุ่มได้แก้ไขตัวบทโดยอัตโนมัติ","กลุ่มให้สัตยาบันความตกลงใหม่แล้วทุกประเทศ"],"explanation":"ถ้อยคำยืนยันทางการเมืองเพียงอย่างเดียวไม่ยืนยันการแก้ไขสนธิสัญญา","refs":["vclt"],"subject":"th","level":3},{"question":"ข้อใดเป็นตัวอย่างการติดตามผลของแผนงานภูมิภาคที่แยกกิจกรรมออกจากผลลัพธ์ได้ดีที่สุด?","answer":"จำนวนการอบรมเป็นกิจกรรม ส่วนเวลาที่ใช้ร่วมตอบสนองภัยพิบัติเป็นตัววัดผลลัพธ์","options":["จำนวนการอบรมเป็นกิจกรรม ส่วนเวลาที่ใช้ร่วมตอบสนองภัยพิบัติเป็นตัววัดผลลัพธ์","จำนวนการประชุมคือผลสำเร็จของการช่วยเหลือผู้ประสบภัยโดยตรง","จำนวนเอกสารที่แจกและจำนวนหน้ารายงานเป็นผลลัพธ์สุดท้ายเท่านั้น"],"explanation":"งานที่จัดขึ้นกับการเปลี่ยนแปลงหน้างานเป็นคนละระดับการวัด","refs":["aha"],"subject":"th","level":3},{"question":"หากเอกสารวิสัยทัศน์อาเซียนฉบับหนึ่งกำหนดเป้าหมาย แต่ไม่กำหนดอัตราอากร ข้อใดเป็นวิธีหาสิทธิอากรของสินค้าจริง?","answer":"ตรวจความตกลงการค้า ตารางข้อผูกพัน และกฎถิ่นกำเนิดที่เกี่ยวข้อง","options":["ตรวจความตกลงการค้า ตารางข้อผูกพัน และกฎถิ่นกำเนิดที่เกี่ยวข้อง","ใช้ปีในชื่อวิสัยทัศน์แทนอัตราอากร","ยึดแถลงการณ์ทางการเมืองเสมือนตารางลดภาษี"],"explanation":"สิทธิอากรขึ้นกับตัวบทและตารางข้อผูกพันทางการค้า","refs":["vision","rcep"],"subject":"th","level":3},{"question":"Only after the final delegation arrived ___ the chair open the session.","answer":"did","options":["did","had","was"],"explanation":"After fronted “only after,” the main clause uses subject–auxiliary inversion.","refs":[],"subject":"en","level":3},{"question":"The delegations agreed on principles, the implementation of ___ would be reviewed annually.","answer":"which","options":["which","whose","whom"],"explanation":"“Of which” refers back to the principles.","refs":[],"subject":"en","level":3},{"question":"The chair’s statement signals convergence on the agenda, but it stops short of endorsing the draft. What is supported?","answer":"There was broad alignment on the agenda without an endorsement of the draft.","options":["There was broad alignment on the agenda without an endorsement of the draft.","The draft was approved because the agenda was agreed.","The delegations could not agree on the agenda."],"explanation":"“Stops short of” marks a step that was not taken.","refs":[],"subject":"en","level":3},{"question":"Had the parties accepted the proposal, the review ___ last month.","answer":"would have begun","options":["would have begun","would begin","will have begun"],"explanation":"The inverted past counterfactual takes “would have” plus a past participle.","refs":[],"subject":"en","level":3},{"question":"Which word best fits? “The agreement calls for sharing data, ___ to each party’s domestic privacy law.”","answer":"subject","options":["subject","pursuant","notwithstanding"],"explanation":"“Subject to” makes the rule conditional on or limited by something else.","refs":[],"subject":"en","level":3},{"question":"“A workable proposal must be both technically sound and politically acceptable.” Which is necessary?","answer":"Both technical soundness and political acceptability","options":["Both technical soundness and political acceptability","Either technical soundness or political acceptability","Political acceptability only when technical soundness fails"],"explanation":"“Both … and” makes each a requirement.","refs":[],"subject":"en","level":3},{"question":"“Not until the annex was circulated ___ how the formula worked.”","answer":"did the delegates see","options":["did the delegates see","the delegates saw","had the delegates saw"],"explanation":"Fronted “not until” triggers inversion in the main clause and uses the base form after “did.”","refs":[],"subject":"en","level":3},{"question":"“These commitments are without prejudice to the parties’ existing rights.” What does “without prejudice to” mean here?","answer":"Without affecting those existing rights","options":["Without affecting those existing rights","Without permitting parties to invoke those rights","Instead of continuing those existing rights"],"explanation":"The phrase preserves the existing legal position on the specified issue.","refs":[],"subject":"en","level":3},{"question":"“Several delegations supported the principle in general but reserved their positions on the financing clause.” What remains open?","answer":"Their positions on the financing clause","options":["Their positions on the financing clause","Whether the statement mentions any support in principle","Whether the financing clause exists"],"explanation":"“Reserve a position” means withhold a final position for now.","refs":[],"subject":"en","level":3},{"question":"Choose the most diplomatic revision of “Your figures are wrong.”","answer":"We would welcome clarification of the assumptions behind these figures.","options":["We would welcome clarification of the assumptions behind these figures.","Your figures are clearly false and must be withdrawn.","We have verified that you knowingly misreported the figures."],"explanation":"The first requests evidence and avoids asserting intent or facts not established.","refs":[],"subject":"en","level":3},{"question":"ร่างมติคณะมนตรีความมั่นคงเรื่องสาระสำคัญได้ 14 เสียงเห็นชอบและสมาชิกถาวรหนึ่งประเทศออกเสียงคัดค้าน ผลคืออะไร?","answer":"ร่างมติไม่ผ่านเพราะถูกวีโต","options":["ร่างมติไม่ผ่านเพราะถูกวีโต","ร่างมติผ่านเพราะครบ 9 เสียง","ต้องให้สมัชชาใหญ่ลงมติซ้ำเพื่อรับรองโดยอัตโนมัติ"],"explanation":"สำหรับเรื่องสาระสำคัญ เสียงคัดค้านของสมาชิกถาวรขัดขวางการรับร่างมติ","refs":["unvote"],"subject":"th","level":3},{"question":"ร่างมติเรื่องสาระสำคัญได้ 9 เสียงเห็นชอบและสมาชิกถาวรงดออกเสียงโดยไม่มีสมาชิกถาวรออกเสียงคัดค้าน ผลตามแนวปฏิบัติคืออะไร?","answer":"รับร่างมติได้","options":["รับร่างมติได้","สมาชิกถาวรงดออกเสียงเท่ากับวีโต","ต้องได้ 15 เสียงเสมอเมื่อมีการงดออกเสียง"],"explanation":"แนวปฏิบัติแยกการงดออกเสียงของสมาชิกถาวรออกจากเสียงคัดค้าน","refs":["unvote"],"subject":"th","level":3},{"question":"สนธิสัญญาฉบับหนึ่งให้ลงนามโดยต้องให้สัตยาบันภายหลัง ก่อนให้สัตยาบัน รัฐผู้ลงนามมีหน้าที่ใดตามข้อ 18 โดยทั่วไป?","answer":"งดการกระทำที่ทำลายวัตถุและความมุ่งประสงค์จนกว่าจะแสดงชัดว่าไม่ประสงค์เป็นภาคี","options":["งดการกระทำที่ทำลายวัตถุและความมุ่งประสงค์จนกว่าจะแสดงชัดว่าไม่ประสงค์เป็นภาคี","ต้องปฏิบัติทุกข้อเสมือนความตกลงมีผลใช้บังคับแล้วโดยอัตโนมัติ","ไม่มีหน้าที่ใดที่เกี่ยวข้องกับสนธิสัญญาในช่วงนั้น"],"explanation":"ข้อ 18 กำหนดหน้าที่เฉพาะก่อนสนธิสัญญามีผลในกรณีที่เข้าเงื่อนไข","refs":["vclt"],"subject":"th","level":3},{"question":"เมื่อมีข้อพิพาทเรื่องถ้อยคำในสนธิสัญญา วิธีเริ่มวิเคราะห์ตามข้อ 31 คืออะไร?","answer":"ตีความโดยสุจริตตามความหมายปกติในบริบทและพิจารณาวัตถุและความมุ่งประสงค์","options":["ตีความโดยสุจริตตามความหมายปกติในบริบทและพิจารณาวัตถุและความมุ่งประสงค์","ยึดบันทึกเจรจาเป็นแหล่งเดียวก่อนดูข้อความ","ยึดความเห็นภายหลังของภาคีฝ่ายเดียวเสมอ"],"explanation":"ข้อ 31 ให้ใช้ตัวบท บริบท และวัตถุประสงค์ร่วมกัน","refs":["vclt"],"subject":"th","level":3},{"question":"รัฐอ้างกฎหมายภายในเพื่อแก้ตัวเมื่อไม่ปฏิบัติตามสนธิสัญญา หลักทั่วไปตามข้อ 27 คืออะไร?","answer":"อ้างกฎหมายภายในเป็นเหตุแก้ตัวไม่ได้ตามหลักทั่วไป โดยคงข้อ 46 ไว้","options":["อ้างกฎหมายภายในเป็นเหตุแก้ตัวไม่ได้ตามหลักทั่วไป โดยคงข้อ 46 ไว้","กฎหมายภายในที่ตราภายหลังยกเลิกพันธกรณีระหว่างประเทศทันที","อ้างได้หากรัฐเป็นผู้เสนอร่างสนธิสัญญา"],"explanation":"ข้อ 27 กำหนดหลักทั่วไป ส่วนข้อ 46 มีเงื่อนไขเฉพาะเกี่ยวกับความยินยอม","refs":["vclt"],"subject":"th","level":3},{"question":"สองรัฐทำสนธิสัญญาระหว่างกันแล้วเขียนหน้าที่ให้รัฐที่สาม โดยรัฐที่สามไม่ได้ยินยอม หลักทั่วไปคืออะไร?","answer":"สนธิสัญญาไม่ก่อพันธกรณีแก่รัฐที่สามโดยปราศจากความยินยอม","options":["สนธิสัญญาไม่ก่อพันธกรณีแก่รัฐที่สามโดยปราศจากความยินยอม","พันธกรณีเกิดทันทีเมื่อสนธิสัญญามีผลระหว่างภาคี","หน้าที่เกิดขึ้นเมื่อจดทะเบียนสนธิสัญญากับ UN แม้รัฐที่สามคัดค้าน"],"explanation":"ข้อ 34 วางหลักเกี่ยวกับรัฐที่สาม","refs":["vclt"],"subject":"th","level":3},{"question":"เรือพาณิชย์ต่างชาติจะเดินเรือผ่าน EEZ ของรัฐชายฝั่ง ข้อใดถูกต้องที่สุด?","answer":"มีเสรีภาพในการเดินเรือภายใต้ UNCLOS โดยคำนึงถึงสิทธิและหน้าที่ของรัฐชายฝั่ง","options":["มีเสรีภาพในการเดินเรือภายใต้ UNCLOS โดยคำนึงถึงสิทธิและหน้าที่ของรัฐชายฝั่ง","ต้องขออนุญาตเสมอเพราะ EEZ เหมือนน่านน้ำภายใน","เสรีภาพเดินเรือแปลว่าเรือมีสิทธิทำประมงได้โดยเสรีด้วย"],"explanation":"ข้อ 58 วางหลักเสรีภาพเดินเรือ ส่วนทรัพยากรอยู่ใต้สิทธิของรัฐชายฝั่งตามข้อ 56","refs":["sea"],"subject":"th","level":3},{"question":"เอกอัครราชทูตมีความคุ้มกัน แต่ถูกกล่าวหาว่าฝ่าฝืนกฎหมายรัฐผู้รับ ข้อใดอธิบายความสัมพันธ์ได้ถูกต้องที่สุด?","answer":"ยังมีหน้าที่เคารพกฎหมาย และการสละความคุ้มกันต้องกระทำโดยรัฐผู้ส่งอย่างชัดแจ้ง","options":["ยังมีหน้าที่เคารพกฎหมาย และการสละความคุ้มกันต้องกระทำโดยรัฐผู้ส่งอย่างชัดแจ้ง","ความคุ้มกันยกเลิกหน้าที่เคารพกฎหมาย","รัฐผู้รับสละความคุ้มกันแทนรัฐผู้ส่งได้เอง"],"explanation":"แยกหน้าที่ตามข้อ 41 ออกจากความคุ้มกันและการสละตามข้อ 31–32","refs":["vienna"],"subject":"th","level":3},{"question":"ผู้เสียหายเอกชนต้องการเป็นคู่ความในคดีพิพาทที่ ICJ โดยฟ้องรัฐโดยตรง ข้อใดถูกต้อง?","answer":"บุคคลเอกชนไม่มีฐานะคู่ความในคดีพิพาทที่ ICJ","options":["บุคคลเอกชนไม่มีฐานะคู่ความในคดีพิพาทที่ ICJ","บุคคลเข้าเป็นคู่ความได้หากถือสัญชาติของสมาชิก UN","บุคคลเข้าเป็นคู่ความได้ถ้าศาลในประเทศมีคำสั่งอนุญาต"],"explanation":"ธรรมนูญ ICJ ข้อ 34(1) ให้เฉพาะรัฐเป็นคู่ความในคดีพิพาท","refs":["icj"],"subject":"th","level":3},{"question":"ข้อใดแยกหน้าที่ตามข้อ 39 และข้อ 41 ของกฎบัตร UN ได้ถูกต้อง?","answer":"ข้อ 39 ให้คณะมนตรีชี้สถานการณ์ด้านสันติภาพ ส่วนข้อ 41 ว่าด้วยมาตรการที่ไม่ใช้กำลัง","options":["ข้อ 39 ให้คณะมนตรีชี้สถานการณ์ด้านสันติภาพ ส่วนข้อ 41 ว่าด้วยมาตรการที่ไม่ใช้กำลัง","ข้อ 39 ว่าด้วยสิทธิลงคะแนน ส่วนข้อ 41 ยอมให้รัฐใช้กำลังป้องกันตนเอง","ข้อ 39 ให้รัฐฟ้องศาล ส่วนข้อ 41 กำหนดสมาชิกถาวร"],"explanation":"ทั้งสองข้ออยู่ในหมวด VII แต่ทำหน้าที่คนละขั้น","refs":["un"],"subject":"th","level":3},{"question":"“Where the two provisions conflict, Article 6 prevails.” What does the clause establish?","answer":"Article 6 controls in the event of conflict.","options":["Article 6 controls in the event of conflict.","Article 6 controls only if both provisions are identical.","Article 6 is repealed whenever there is a conflict."],"explanation":"“Prevails” establishes priority in the stated circumstances.","refs":[],"subject":"en","level":3},{"question":"The obligation remains in force ___ otherwise agreed by the parties.","answer":"unless","options":["unless","although","given that"],"explanation":"“Unless otherwise agreed” creates an exception by agreement.","refs":[],"subject":"en","level":3},{"question":"What does “notwithstanding” mean in “notwithstanding the preceding paragraph”?","answer":"Despite","options":["Despite","In addition to and always consistent with","Only as required by"],"explanation":"The term signals that the rule applies despite the cited provision.","refs":[],"subject":"en","level":3},{"question":"Were the parties to ratify the instrument, it ___ enter into force under the stated conditions.","answer":"would","options":["would","will have","must have"],"explanation":"“Were … to” introduces a hypothetical condition and pairs with “would.”","refs":[],"subject":"en","level":3},{"question":"“The committee found the evidence inconclusive. It did not find the allegation false.” Which is the best inference?","answer":"The evidence did not allow a firm conclusion about the allegation.","options":["The evidence did not allow a firm conclusion about the allegation.","The committee proved the allegation false.","The committee accepted the allegation as established."],"explanation":"Inconclusive evidence leaves the question unresolved.","refs":[],"subject":"en","level":3},{"question":"Which wording expressly introduces a necessary condition?","answer":"The waiver applies only if written notice is given.","options":["The waiver applies only if written notice is given.","The waiver applies even if written notice is withheld.","The waiver applies whether or not written notice is given."],"explanation":"“Only if” makes notice necessary without stating that it is sufficient.","refs":[],"subject":"en","level":3},{"question":"“The term shall be interpreted in light of the agreement’s purpose.” What role does the purpose play?","answer":"It informs the interpretation.","options":["It informs the interpretation.","It replaces every provision automatically.","It applies only if all parties ignore the text."],"explanation":"“In light of” means taking something into account.","refs":[],"subject":"en","level":3},{"question":"“The clause does not preclude a later agreement.” Which is closest in meaning?","answer":"A later agreement remains possible.","options":["A later agreement remains possible.","A later agreement is mandatory.","A later agreement is automatically in force."],"explanation":"“Preclude” means prevent or rule out.","refs":[],"subject":"en","level":3},{"question":"“The decision was upheld on procedural grounds, leaving the substantive issue open.” What is clear?","answer":"The outcome stood, but the underlying substantive issue was unresolved.","options":["The outcome stood, but the underlying substantive issue was unresolved.","The substantive issue was resolved in full.","The decision was overturned because of procedural error."],"explanation":"“Upheld” preserves the outcome; the basis was procedural.","refs":[],"subject":"en","level":3},{"question":"Choose the sentence that states the narrower claim.","answer":"The measure may apply to certain categories.","options":["The measure may apply to certain categories.","The measure applies automatically to every category.","The measure always applies regardless of category."],"explanation":"“May” and “certain” both limit the claim.","refs":[],"subject":"en","level":3},{"question":"ผู้นำเข้าจ่าย 100,000 ดอลลาร์ ค่าเงินเปลี่ยนจาก 34 เป็น 36 บาทต่อดอลลาร์ และไม่มีการป้องกันความเสี่ยง ต้นทุนเงินบาทเปลี่ยนเท่าใด?","answer":"เพิ่ม 200,000 บาท","options":["เพิ่ม 200,000 บาท","ลด 200,000 บาท","เพิ่ม 20,000 บาท"],"explanation":"ส่วนต่าง 2 บาทต่อดอลลาร์คูณด้วย 100,000 ดอลลาร์","refs":["fx"],"subject":"th","level":3},{"question":"ผู้ส่งออกมีรายรับ 100,000 ดอลลาร์และต้นทุนวัตถุดิบ 60,000 ดอลลาร์ในงวดเดียวกัน ค่าเงินเปลี่ยนจาก 34 เป็น 36 บาทต่อดอลลาร์ ส่วนต่างก่อนต้นทุนอื่นเปลี่ยนอย่างไร?","answer":"เพิ่ม 80,000 บาท","options":["เพิ่ม 80,000 บาท","เพิ่ม 200,000 บาท","ลด 120,000 บาท"],"explanation":"ฐานะสุทธิเป็นรายรับ 40,000 ดอลลาร์ คูณกับส่วนต่าง 2 บาทต่อดอลลาร์","refs":["fx"],"subject":"th","level":3},{"question":"เพิ่มอากรให้สินค้าจากสมาชิก X เท่านั้นและเพิ่มภาษีภายในให้สินค้านำเข้าทุกแหล่งเมื่อเทียบกับสินค้าท้องถิ่นที่เหมือนกัน ควรตรวจประเด็นใดตามลำดับ?","answer":"MFN แล้ว National Treatment","options":["MFN แล้ว National Treatment","National Treatment แล้ว MFN","กฎถิ่นกำเนิด แล้ว safeguard"],"explanation":"อากรต่างกันตามแหล่งสะท้อน MFN และภาษีภายในต่างกันตามสถานะนำเข้าสะท้อน National Treatment","refs":["trade"],"subject":"th","level":3},{"question":"ข้อใดจำแนกมาตรการ safeguard ออกจาก anti-dumping ได้ดีที่สุด?","answer":"Safeguard เน้นการนำเข้าเพิ่มและความเสียหายร้ายแรง ส่วน anti-dumping ต้องตรวจการทุ่มตลาดและความเสียหายตามเกณฑ์","options":["Safeguard เน้นการนำเข้าเพิ่มและความเสียหายร้ายแรง ส่วน anti-dumping ต้องตรวจการทุ่มตลาดและความเสียหายตามเกณฑ์","ทั้งสองมาตรการต้องพิสูจน์เงินอุดหนุนของรัฐบาลผู้ส่งออก","Safeguard ใช้เพียงเมื่อผู้ส่งออกตั้งราคาต่ำกว่ามูลค่าปกติ"],"explanation":"ฐานข้อเท็จจริงและเกณฑ์ความเสียหายของมาตรการสองประเภทต่างกัน","refs":["safeguard","wtoGloss"],"subject":"th","level":3},{"question":"ผู้ผลิตไทยใช้วัตถุดิบจากภาคี RCEP ต้องตัดสินถิ่นกำเนิดอย่างไร?","answer":"ตรวจว่าปัจจัยการผลิตมีถิ่นกำเนิดตามเกณฑ์ และตรวจเงื่อนไขสะสมถิ่นกำเนิดกับกฎรายสินค้า","options":["ตรวจว่าปัจจัยการผลิตมีถิ่นกำเนิดตามเกณฑ์ และตรวจเงื่อนไขสะสมถิ่นกำเนิดกับกฎรายสินค้า","ถือว่าสินค้าผ่านเพียงเพราะซื้อวัตถุดิบจากผู้ขายที่จดทะเบียนในภาคี","ดูเพียงสัญชาติของเจ้าของโรงงาน"],"explanation":"สถานที่ซื้ออย่างเดียวไม่ยืนยันสถานะถิ่นกำเนิด","refs":["rcep"],"subject":"th","level":3},{"question":"หากนักท่องเที่ยวต่างชาติจ่ายค่าบริการโรงแรมในไทย และคนไทยซื้อพันธบัตรต่างประเทศ รายการเกี่ยวข้องกับบัญชีใดตามลำดับ?","answer":"บัญชีเดินสะพัด แล้วบัญชีการเงิน","options":["บัญชีเดินสะพัด แล้วบัญชีการเงิน","บัญชีการเงิน แล้วบัญชีเดินสะพัด","บัญชีทุนทั้งสองรายการ"],"explanation":"บริการท่องเที่ยวอยู่ในบัญชีเดินสะพัด และการซื้อหลักทรัพย์เป็นการลงทุนในบัญชีการเงิน","refs":["bop"],"subject":"th","level":3},{"question":"ความตกลงปารีสข้อ 13 กับข้อ 14 แยกหน้าที่อย่างไร?","answer":"ข้อ 13 วางกรอบความโปร่งใส ส่วนข้อ 14 ประเมินความก้าวหน้าร่วมผ่าน Global Stocktake","options":["ข้อ 13 วางกรอบความโปร่งใส ส่วนข้อ 14 ประเมินความก้าวหน้าร่วมผ่าน Global Stocktake","ข้อ 13 ตั้งเป้าหมายอุณหภูมิ ส่วนข้อ 14 กำหนดภาษีคาร์บอนเดียวทั่วโลก","ข้อ 13 และ 14 ต่างให้อำนาจกำหนดคะแนนและปรับรัฐโดยอัตโนมัติ"],"explanation":"การรายงานและทบทวนข้อมูลสนับสนุนการประเมินรวม แต่สองข้อทำหน้าที่ต่างกัน","refs":["parisText"],"subject":"th","level":3},{"question":"เมื่อจะประเมินว่านโยบายภูมิอากาศลดการปล่อยจริง ควรเลือกตัวชี้วัดใด?","answer":"ปริมาณการปล่อยที่วัดหรือประมาณตามวิธีเดียวกันและเทียบกับฐานที่ชัดเจน","options":["ปริมาณการปล่อยที่วัดหรือประมาณตามวิธีเดียวกันและเทียบกับฐานที่ชัดเจน","จำนวนสไลด์ที่นำเสนอในที่ประชุม","ยอดผู้เข้าร่วมรับฟังเพียงอย่างเดียว"],"explanation":"ใช้ตัวชี้วัดที่สัมพันธ์กับผลที่อ้าง และระบุวิธีเปรียบเทียบ","refs":["parisText"],"subject":"th","level":3},{"question":"ประเทศหนึ่งประกาศ NDC สูงขึ้น ข้อใดสรุปได้จากการประกาศอย่างเดียว?","answer":"ระดับความมุ่งหมายที่สื่อสารเปลี่ยน ส่วนผลที่เกิดต้องดูการดำเนินงานและข้อมูลการปล่อย","options":["ระดับความมุ่งหมายที่สื่อสารเปลี่ยน ส่วนผลที่เกิดต้องดูการดำเนินงานและข้อมูลการปล่อย","การปล่อยลดลงเท่ากับเป้าหมายทันที","ทุกประเทศต้องเปลี่ยนเป้าหมายให้เท่ากัน"],"explanation":"เป้าหมายกับการดำเนินการและผลจริงเป็นข้อมูลคนละระดับ","refs":["ndc"],"subject":"th","level":3},{"question":"SDR ของ IMF มีสถานะใด?","answer":"สินทรัพย์สำรองระหว่างประเทศที่ IMF สร้างขึ้น","options":["สินทรัพย์สำรองระหว่างประเทศที่ IMF สร้างขึ้น","สกุลเงินสากลที่ประชาชนใช้ชำระค่าสินค้าได้โดยทั่วไป","สิทธิออกเสียงใน WTO"],"explanation":"SDR เป็นสินทรัพย์สำรอง และแลกเป็นสกุลเงินที่ใช้ได้โดยเสรีได้ตามกลไก","refs":["sdr"],"subject":"th","level":3},{"question":"“The headline rate eased, yet the index itself continued to rise.” What is consistent with that statement?","answer":"Prices rose more slowly.","options":["Prices rose more slowly.","Prices necessarily fell.","The index fell because it was unchanged."],"explanation":"A lower positive growth rate can coexist with a higher index level.","refs":[],"subject":"en","level":3},{"question":"“The policy was associated with lower costs, after adjusting for firm size.” Which claim is justified?","answer":"There was an adjusted association. Causation needs further evidence.","options":["There was an adjusted association. Causation needs further evidence.","The estimate proves the policy lowered costs for each firm.","Firm size caused the policy change."],"explanation":"Adjustment helps address one factor but does not by itself establish causality.","refs":[],"subject":"en","level":3},{"question":"Choose the word that fits. “The baseline is uncertain, so the estimate should be treated as ___.”","answer":"provisional","options":["provisional","prescriptive","definitive"],"explanation":"“Provisional” means subject to revision after further information.","refs":[],"subject":"en","level":3},{"question":"“Although revenue rose in nominal terms, it fell after adjusting for inflation.” What happened in real terms?","answer":"Revenue fell.","options":["Revenue fell.","Revenue rose by the nominal increase.","Revenue was unchanged."],"explanation":"Inflation-adjusted values are real values.","refs":[],"subject":"en","level":3},{"question":"“Had the exchange rate remained stable, the foreign-exchange loss would have been smaller.” What does the sentence imply about the actual exchange rate?","answer":"It did not remain stable.","options":["It did not remain stable.","It did remain stable.","Its exact percentage change is disclosed."],"explanation":"The past counterfactual describes a condition that did not hold.","refs":[],"subject":"en","level":3},{"question":"“The estimate holds other factors constant.” What limitation follows?","answer":"It describes a modeled comparison allowing for an assumption about other factors.","options":["It describes a modeled comparison allowing for an assumption about other factors.","It proves all other factors actually stayed unchanged.","It requires every factor to change simultaneously."],"explanation":"“Holding constant” can be an analytical assumption rather than a description of observed conditions.","refs":[],"subject":"en","level":3},{"question":"Choose the best connector. “Demand fell. Rising input costs, ___, kept prices high.”","answer":"however","options":["however","therefore","similarly"],"explanation":"“However” introduces the countervailing factor.","refs":[],"subject":"en","level":3},{"question":"“Several firms diversified their suppliers to hedge against disruption.” What was their purpose?","answer":"Reduce exposure to supply disruption","options":["Reduce exposure to supply disruption","Guarantee disruption could never occur","Consolidate purchases with one supplier"],"explanation":"To hedge against a risk is to reduce exposure to it.","refs":[],"subject":"en","level":3},{"question":"“The decline was concentrated in two sectors.” What can be inferred?","answer":"Two sectors accounted for a substantial part of the decline.","options":["Two sectors accounted for a substantial part of the decline.","Every sector contributed equally.","No other sector could have declined."],"explanation":"“Concentrated” describes where the decline was most pronounced.","refs":[],"subject":"en","level":3},{"question":"Which conclusion preserves the qualification? “The results are robust to alternative assumptions within the tested range.”","answer":"The results are stable across the tested assumptions.","options":["The results are stable across the tested assumptions.","The results hold under every possible assumption.","The results must change under any untested assumption."],"explanation":"The conclusion is limited to the alternatives examined.","refs":[],"subject":"en","level":3},{"question":"รายงาน UPR ใช้คำว่า “รัฐรับทราบข้อเสนอแนะ” ควรเขียนสรุปอย่างไร?","answer":"รัฐรับทราบข้อเสนอแนะ และควรตรวจสถานะการสนับสนุนแยกต่างหาก","options":["รัฐรับทราบข้อเสนอแนะ และควรตรวจสถานะการสนับสนุนแยกต่างหาก","รัฐยอมรับข้อเสนอและดำเนินการครบแล้ว","คณะทำงานออกคำตัดสินบังคับทางศาล"],"explanation":"แยกข้อเสนอที่สนับสนุนกับข้อเสนอที่รับทราบ และแยกออกจากผลปฏิบัติ","refs":["uprProcess"],"subject":"th","level":3},{"question":"หากต้องเปรียบเทียบข่าวการประชุมอาเซียนของสองปีและต้องการทราบว่ามติเปลี่ยนตรงไหน หลักฐานใดเหมาะที่สุด?","answer":"เอกสารผลการประชุมฉบับทางการทั้งสองปีและข้อความที่เกี่ยวข้อง","options":["เอกสารผลการประชุมฉบับทางการทั้งสองปีและข้อความที่เกี่ยวข้อง","พาดหัวฉบับล่าสุดฉบับเดียว","จำนวนผู้ติดตามของสื่อที่รายงาน"],"explanation":"เปรียบเทียบถ้อยคำทางการของทั้งสองช่วงเวลาโดยตรง","refs":["five"],"subject":"th","level":3},{"question":"มีรายงานค่าเฉลี่ยมลพิษดีขึ้น แต่ชุดข้อมูลปีล่าสุดตัดจุดตรวจที่มลพิษสูงออก ควรทำอย่างไร?","answer":"คำนวณใหม่เฉพาะจุดตรวจที่มีทั้งสองช่วง และเปิดเผยผลของการตัดจุด","options":["คำนวณใหม่เฉพาะจุดตรวจที่มีทั้งสองช่วง และเปิดเผยผลของการตัดจุด","เปรียบเทียบค่าเฉลี่ยทันทีเพราะจำนวนปีเท่ากัน","สรุปว่าการลดลงเกิดจากนโยบายอย่างแน่นอน"],"explanation":"การเป
